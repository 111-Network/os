[[fake]]
path = "fx/fake-daemon.py"
mirrors = "b"
seam = "L3-L4:fx-faked"
parity = "none"

[[known]]
test = "fx.known"
condition = "euid0"
source = "fx/TASKS.md:1"
reason = "fails as root in the fixture"

[unmapped]
"fx/unrelated.sh" = "a fixture script tied to no seam"
