# Fixture catalog for the runner's own tests (verify/tests). Every cmd runs a tiny script the tests write into a temp
# git repo under fx/ (helpers.FX_SCRIPTS); nothing here runs a gate of the real repo.

[[check]]
id = "fx.pass"
kind = "unit"
cmd = ["sh", "fx/pass.sh"]
tier = "fast"
layers = [1, 2]
seams = ["L1-L2:fx-alpha"]
strength = "I"
timeout_s = 30
rerun = "sh fx/pass.sh  # {check}"
rerun_cost = "fast, ~0 s"

[[check]]
id = "fx.fail"
kind = "unit"
cmd = ["sh", "fx/fail.sh"]
tier = "fast"
layers = [3, 4]
seams = ["L3-L4:fx-faked"]
strength = "F"
timeout_s = 30

[[check]]
id = "fx.needs"
kind = "unit"
cmd = ["sh", "fx/pass.sh"]
tier = "fast"
layers = [1]
seams = ["L1-L2:fx-alpha"]
strength = "I"
timeout_s = 30
needs = ["t111-no-such-tool-anywhere"]

