# verify/seams.toml: the seam map of the cross-layer test runner (row X1; options.md 3.5).
#
# One [[seam]] per layer-to-layer interface of plan/cross-layer/test-system/research/05-seams.md and matrix.md, sorted by id:
# the 89 that exist (status built, or stub when a side is still a Layer 7 T0 stub or not built yet) and the 14 planned
# Layer 8 / 9 rows (status planned, no files yet). a is the side of the id's first layer, b the second (X1b: the lint does not
# hold this, a read does; one seam had them swapped); read_first is the side whose data the failing assertions read (the
# producer), where a running-system failure points first; symptom is what a daemon log, an API answer or the UI shows when the
# seam breaks, in the words the code and the contract use (a service row's state is live | unset | error | starting, a
# network's live | not_set | error | disabled); gap says in one sentence what no check of strength R covers.
# Which checks prove a seam is read from checks.toml (a check lists it under seams or phases). The schema is
# verify/t111/schema.py; the lint (python3 -I verify/run.py --lint) holds every path and spec section to the tree.

