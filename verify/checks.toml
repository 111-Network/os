# verify/checks.toml: the check catalog of the cross-layer test runner (row X1; options.md 3.5 and 3.6).
#
# Every existing gate and harness is one [[check]]; nothing here is a new assertion. A GATE runs a layer's own
# script as is; a UNIT runs one test binary, one vitest file or one harness alone, names the gate that covers it
# (covered_by: in a full run the gate runs and derives the unit's records, so no suite runs twice) and carries the
# seams its results prove. Tiers: fast = seconds, no build; slow = a cargo or pnpm build or suite; ns = namespaces
# or root, one at a time (every ns check takes the lock "verify"). cargo = true on every check that builds.
# strength is the evidence a check gives its seams: R running system, I integration with the real peer,
# F against a fake, C compiled or static only, N none (the T0 stubs). A seam's strength is its best check, so a
# check never rates higher than the matrix rates the seams it lists. Timeouts: three times a stated runtime, else
# 1800 s for slow and ns (a stated runtime leaves out a cold cargo build; l1.gate takes the 90 min CI bound, 5400 s).
# The schema is verify/t111/schema.py.
#
# SEAM ORDER IS MEANING, NEVER SORTED. A record takes its sides, its read_first and (for an F check) its fake from the
# FIRST seam of the check's `seams` list, or of the `phases` entry its phase matches (t111/record.py enrich). So in every
# `seams` list and every `phases` value the PRIMARY seam comes first: the seam whose files the check's assertions
# exercise, decided by reading the test or harness (the test fns, the phase headers), not by the seam's name. The seams
# after it follow by how much of the check they carry. A check with one seam has no order to keep.
# FAKE ORDER IS MEANING TOO: for a check of strength F the record names the FIRST [[fake]] declared on its primary seam
# (t111/record.py enrich), whichever check it belongs to. So the fake a F check itself runs against comes first on its
# primary seam, and two F checks that face a seam from opposite sides cannot share a primary seam (they would name each
# other's fake and read the wrong side first): the second gets a seam of its own (L6-X:rns-lxmf-api for the LXMF helper).
# MODULE PATHS: a libtest unit whose cmd carries test filters owns the tests whose path contains one (the adapter
# attributes a gate's records by the longest matching filter, the unit with no filter takes the rest): the node111 --lib
# tests are split by module path into the l1.node111.lib-* units below, so each failure names the seam of its own module.
#
# Locks: every ns check takes "verify" (one harness at a time). "ui-dist" is the lock of 4-interface/ui/dist: held by every
# check that builds or rewrites it (vite empties the output dir first): l1.gate, l4.ui, l4.budget, l4.smoke, l4.smoke3,
# l4.panel-lint, and also the three cargo units that READ it (rust-embed reads dist per request in a debug build, and
# dashboard_auth reads index.html twice, a request and then ui_embedded(), so a build between the two reads fails it):
# l1.node111.{dashboard_auth,dashboard_http,api_v1_panels}. In a full run l1.gate already serialises them; the lock only
# costs a targeted run that selects them beside a UI build.
# `needs` lists the tool a check's cmd starts with (cargo, bash, pnpm, python3) so a box without it is SKIPPED, not RED.
# A need that names no tool on this box (x5-log-to-scratch) keeps a check SKIPPED until its row lands.
#
# Per-unit rerun templates fill {test} with the failing test's own name; {check} and {root} are filled too.

# ========================================================================
# FAST: seconds, no cargo or pnpm build, no namespace
# ========================================================================

# The map lint (options.md 3.5): holds seams.toml and checks.toml to the tree. Writes nothing (-B: no import cache in the tree).
[[check]]
id = "x.seams.lint"
kind = "gate"
cmd = ["python3", "-I", "-B", "verify/run.py", "--lint"]
tier = "fast"
layers = ["X"]
seams = ["X:plan-vs-code"]
adapter = "okfail"
timeout_s = 300
rerun_cost = "fast, ~2 s"
strength = "C"
needs = ["python3"]

# The Layer 0 validator (pre-commit and CI run it). Needs PyYAML; can go red by date alone (STALE_ERROR_DAYS).
[[check]]
id = "l0.kb.check"
kind = "gate"
cmd = ["python3", "0-knowledge/_meta/build.py", "--check"]
tier = "fast"
layers = [0]
seams = ["L0-L1:index-gate", "L0-L5/6/7:entries", "X:plan-vs-code"]
adapter = "buildpy"
timeout_s = 300
env = { PYTHONDONTWRITEBYTECODE = "1" }
rerun_cost = "fast, ~5 s"
strength = "C"
needs = ["python3"]

# The validator's golden-fixture suite; run by no hook and no CI job until this catalog (N5).
