[[check]]
id = "l1.node111.api_v1_bridge"
kind = "unit"
cmd = ["cargo", "test", "--manifest-path", "1-bootstrap/Cargo.toml", "-p", "node111", "--test", "api_v1_bridge"]
tier = "slow"
layers = [1, 4, 5, 6]
seams = ["L4-L6:networks-bridge-api", "L5-L6:foreign-tables", "L1-L4:openapi-rust"]
adapter = "libtest"
cargo = true
timeout_s = 1800
rerun = "cargo test --manifest-path 1-bootstrap/Cargo.toml -p node111 --test api_v1_bridge -- --exact {test}"
rerun_cost = "slow, ~20 s warm"
covered_by = "l1.gate"
strength = "I"
requires = ["l4.contract.fresh"]
needs = ["cargo"]

