# ========================================================================
# SLOW: a cargo or pnpm build or suite
# ========================================================================

# Layer 1 aggregate: fmt, clippy, musl check, node111 cargo test, shellcheck, the hermetic gate tests, notices,
# systemd-analyze, the nested mesh111 gate, G2, the presence sidecar, the UI pnpm check. Stops at the first failure.
# A skipped stage prints SKIPPED and the run still exits 0: REQUIRE_G2=1 makes the G2 skip a failure (lock runs).
# Timeout 3600 s: the 90 min CI bound is a ceiling, a cold build of node111 and mesh111 is not in any stated runtime.
# Strength C: the gate's own stages (fmt, clippy, check, notices, the UI budget) are static; the tests it runs are the
# units below, each with its own strength. Its phases attribute the static stages to the seams they compile or check.
[[check]]
id = "l1.gate"
kind = "gate"
cmd = ["sh", "1-bootstrap/scripts/check.sh"]
tier = "slow"
layers = [1, 2, 4, 5, 6, 7]
seams = [
  "L1-L5:payload-assets",
  "L1-L6:bridge-stubs",
  "L4-L4:budget",
  "L4-L4:openapi-ts",
  "L5-L6:presence-file",
  "X:licensing-notices",
]
phases = { "build scripts" = ["L1-L5:payload-assets"], "clippy" = ["L1-L6:bridge-stubs"], "notices" = ["X:licensing-notices"], "presence sidecar" = ["L5-L6:presence-file"], "ui" = ["L4-L4:budget", "L4-L4:openapi-ts"] }
adapter = "stagewise"
cargo = true
timeout_s = 3600
rerun_cost = "slow, ~25 min warm"
strength = "C"
needs = ["cargo"]

# Reads 4-interface/ui/test/contract.gen.ts, so it requires l4.contract.fresh (a stale
# digest would be read as truth).
[[check]]
id = "l1.node111.api_v1_bridge"
kind = "unit"
cmd = ["cargo", "test", "--manifest-path", "1-bootstrap/Cargo.toml", "-p", "node111", "--test", "api_v1_bridge"]
tier = "slow"
layers = [1, 4, 5, 6]
seams = ["L1-L4:openapi-rust", "L4-L6:networks-bridge-api", "L5-L6:foreign-tables"]
adapter = "libtest"
cargo = true
timeout_s = 1800
rerun = "cargo test --manifest-path 1-bootstrap/Cargo.toml -p node111 --test api_v1_bridge -- --exact {test}"
rerun_cost = "slow, ~20 s warm"
covered_by = "l1.gate"
strength = "I"
requires = ["l4.contract.fresh"]

