# ========================================================================
# KNOWN (options.md F7): results that are known under a condition. A matching FAIL becomes SKIPPED with the
# reason 'known: ...'; --require turns it back into FAIL. The eight tests below fail on a root box because they
# assume a non-root user (7 in phone_flow, 1 in api_v1_messages); 6-transport/TASKS.md:80 records the count, the
# names are in plan/layers/6-transport/runs/workflows/wave-3.js (AS_BUILT). HANDOFF-2026-11-02 also names
# install_flow ('free space') as root-failing, but no test fn is named for it, so it is not listed.
# No entry names a `check`: a record carries the unit's id in a unit run and may carry the gate's in a gate run, and an
# entry that named the unit would match only the first shape. Each */<test fn> pattern is unique in the tree (grep: one
# test fn each), so the pattern alone is exact.
# ========================================================================

