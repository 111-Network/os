# THE node111 --lib TESTS, SPLIT BY MODULE PATH. One `cargo test -p node111 --lib` runs them all (in a gate run too: l1.gate's
# one cargo test prints them under the single binary `unittests src/lib.rs`), and the libtest adapter gives each test to
# the unit whose filter (a substring of the test's path, the longest wins) it contains, and to the unit with no filter when
# none does. So a record names the seam of its own module, not of the first module of a 700-test list. The owners:
#   identity::                         lib-identity      (identity/, identity/commission.rs)
#   daemon::kb:: daemon::health::      lib-kb
#   daemon::supervise:: daemon::services::probe::   lib-health
#   install::verify::                  lib-install
#   daemon::intelligence::             lib-intelligence
#   daemon::fabric::sealer::           lib-sealer
#   daemon::bridge::attest::           lib-attest
#   daemon::bridge::simplex::          lib-simplex
#   daemon::relay::settings::          lib-relay
#   daemon::relay::netwatch:: daemon::transport::netlink::   lib-netwatch
#   daemon::relay::gateway::           lib-gateway
#   daemon::relay::pair:: daemon::relay::tls::               lib-pair
#   every other --lib test             l1.node111.lib (below)
# The filters are full module paths from the crate root: a bare `cli::` also matches daemon::fabric::cli, a bare `relay::`
# matches dashboard::api_v1::relay. The residual unit skips what the others own (`--skip=<path>`), so a unit run of any of
# them runs each test once. Not split (a unit of its own would take another unit's fake on its seam, see the header):
# meshtastic/presence.rs (seam L5-L6:presence-file: its first fake is the presence reader's own, which mirrors the other
# side), and the modules with no seam of their own (relay/linkkey.rs and origin/mod.rs have origin_serve and relay_tls).

# The residual of node111 --lib: every test no lib-* unit above owns (calver, cli, config, floor, manifest, the bridge core,
# the carrier, the components, the dashboard routes and api_v1 handlers, the devices, the fabric but its sealer, the
# meshtastic client and presence, the panels, the relay linkkey, the transport but netlink, the updater, the origin, the rest
# of install, util ...). It proves no seam of its own: a record of it has no seam and so no read_first, which is better than
# a wrong one. Reads 4-interface/ui/test/contract.gen.ts (fabric/json.rs foreign_tests), so it requires l4.contract.fresh.
[[check]]
id = "l1.node111.lib"
kind = "unit"
cmd = [
  "cargo",
  "test",
  "--manifest-path",
  "1-bootstrap/Cargo.toml",
  "-p",
  "node111",
  "--lib",
  "--",
  "--skip=identity::",
  "--skip=daemon::kb::",
  "--skip=daemon::health::",
  "--skip=daemon::supervise::",
  "--skip=daemon::services::probe::",
  "--skip=install::verify::",
  "--skip=daemon::intelligence::",
  "--skip=daemon::fabric::sealer::",
  "--skip=daemon::bridge::attest::",
  "--skip=daemon::bridge::simplex::",
  "--skip=daemon::relay::settings::",
  "--skip=daemon::relay::netwatch::",
  "--skip=daemon::transport::netlink::",
  "--skip=daemon::relay::gateway::",
  "--skip=daemon::relay::pair::",
  "--skip=daemon::relay::tls::",
]
tier = "slow"
layers = [1, 4, 5, 6]
adapter = "libtest"
cargo = true
timeout_s = 1800
rerun = "cargo test --manifest-path 1-bootstrap/Cargo.toml -p node111 --lib -- --exact {test}"
rerun_cost = "slow, ~30 s warm"
covered_by = "l1.gate"
strength = "F"
needs = ["cargo"]
