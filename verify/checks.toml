# Layer 4 gate: typecheck, vitest, vite build, size budget. check.sh also runs it as its last stage (a full run
# therefore runs this check twice, see l1.gate). Its seams are those of its static stages (the typecheck reads the
# generated types, the budget reads the built chunks); the vitest files are the units below, each with its own seams.
# `pnpm check` = typecheck, vitest, build, budget. NO `seams`: a vitest failure in one of the test files no unit owns (the
# [unmapped] ones: markdown, shell, store ...) must not read as a break of the contract generator or the budget. The units
# below own the files that prove a seam; their records carry their own seams. `phases` names what each stage proves (the
# `--seam` selection reads it) but the vitest adapter reads no stage header from `pnpm check` (t111/adapters.py: the vitest
# scope has no phase), so today the gate's own records (a typecheck error, `exit 1 but no failing result was parsed` for a
# build or budget failure) carry no seam and no read_first. Reading the stage from the `> ui@... typecheck` lines is X3 work.
[[check]]
id = "l4.ui"
kind = "gate"
cmd = ["pnpm", "check"]
cwd = "4-interface/ui"
tier = "slow"
layers = [4]
phases = { "typecheck" = ["L4-L4:openapi-ts"], "build" = ["L4-L4:budget"], "budget" = ["L4-L4:budget"] }
adapter = "vitest"
lock = "ui-dist"
timeout_s = 1800
rerun_cost = "slow, ~3 min"
strength = "C"
needs = ["pnpm"]

