# ========================================================================
# SLOW: a cargo or pnpm build or suite
# ========================================================================

# Layer 1 aggregate: fmt, clippy, musl check, node111 cargo test, shellcheck, the hermetic gate tests, notices,
# systemd-analyze, the nested mesh111 gate, G2, the presence sidecar, the UI pnpm check. Stops at the first failure.
# A skipped stage prints SKIPPED and the run still exits 0: REQUIRE_G2=1 makes the G2 skip a failure (lock runs).
# Timeout 5400 s, the 90 min CI bound: a cold build of node111 and mesh111 on a 2-job box (clippy, test, musl x2, mesh111,
# G2, UI) is in no stated runtime and passes 60 min.
# Strength C: the gate's own stages (fmt, clippy, check, notices, the UI budget) are static; the tests it runs are the
# units below, each with its own strength. Its phases attribute the static stages to the seams they compile or check.
# Layers: the ones this gate owns: 1, plus those of its own static stages (build scripts 1 and 5, clippy 1 and 6,
# presence sidecar 5 and 6, UI budget and types 4, notices X). Not 2, 3 or 7: the suites it runs belong to the units.
# A unit covered by this gate still selects it (select.py: a layer-N unit whose gate is out of the layer filter is
# replaced by the gate), so `--layer 2|4|5|6|7` can still plan this 25 min gate; `--check` and `--seam` run the units.
# A FULL run runs two suites twice, on purpose: the mesh111 suites (this gate's nested 5-messaging/scripts/check.sh
# stage, then l5.gate, whose forward suite alone is ~3 min) and the UI `pnpm check` (this gate's last stage, then
# l4.ui). That is CI parity (plan/cross-layer/ci-cd.md, D28): the bootstrap-gate job must run check.sh whole, so the
# gate stays whole here; do not "fix" the repeat by dropping l5.gate or l4.ui (they are the quick path alone).
# Units attribute their records out of this gate's output: the node111 --lib records go to the l1.node111.lib-* units by
# module path (see l1.node111.lib).
# No `requires`: the gate's fmt, clippy, node111 tests and shellcheck do not read the contract digest, and a box without node
# (or with a stale digest) must still run them: its ui stage prints SKIPPED and the rest runs. l4.contract.fresh is a fast
# default check, so a stale digest turns a default or layer run RED by itself; the units that read the digest require it.
[[check]]
id = "l1.gate"
kind = "gate"
cmd = ["sh", "1-bootstrap/scripts/check.sh"]
tier = "slow"
layers = [1, 4, 5, 6, "X"]
seams = [
  "L1-L5:payload-assets",
  "L1-L6:bridge-stubs",
  "L4-L4:budget",
  "L4-L4:openapi-ts",
  "L5-L6:presence-file",
  "X:licensing-notices",
]
phases = { "build scripts" = ["L1-L5:payload-assets"], "clippy" = ["L1-L6:bridge-stubs"], "notices" = ["X:licensing-notices"], "presence sidecar" = ["L5-L6:presence-file"], "ui" = ["L4-L4:openapi-ts", "L4-L4:budget"] }
adapter = "stagewise"
cargo = true
lock = "ui-dist"
timeout_s = 5400
rerun_cost = "slow, ~25 min warm"
strength = "C"
needs = ["cargo"]

# Reads 4-interface/ui/test/contract.gen.ts, so it requires l4.contract.fresh (a stale
