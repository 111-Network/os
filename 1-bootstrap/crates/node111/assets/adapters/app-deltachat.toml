# Adapter manifest (Layer 6 §4 `caps().copy`, §7 app peers; Delta Chat is the reference). Parsed with
# deny_unknown_fields by the bridge core. Refined by C5 with the netns spike's facts
# (plan/layers/6-transport/research/08-spike-deltachat.md §6, §7): the adapter is `daemon/bridge/deltachat.rs`.
id = "app:deltachat"                    # network id (§3)
label = "Delta Chat"
chip = "DC"
tag = "DC"                              # relay marker TAG (§8): bridged copies carry `[name/DC] ` as a visible prefix only
kinds = ["dm", "group"]                 # only groups can be relay endpoints (§7 (4))
# spike §6: 20 pending ⇒ queued, 26 MsgDelivered ⇒ sent ("the relay accepted it"; the core has no separate hand-off,
# so `relayed` never occurs), 28 MsgRead ⇒ delivered (the recipient's read receipt; it may never come)
evidence = ["queued", "sent", "delivered"]

[auth]
none = "the app's end-to-end encryption ends on this hub; 111 vouches for nothing about the sender's name"

[copy]
banner = "This hub decrypts everything its Delta Chat bridge account receives, including messages from contacts you do not bridge. The plaintext exists on this hub: the hub terminates Delta Chat's end-to-end encryption. Contacts join by scanning the bridge account's Secure-Join code; bridging is off for each one until you turn it on. A delivered mark means the recipient's app sent a read receipt, which may never come."
send_warning = "111 sends from this hub's own Delta Chat bridge account, flagged as a bot, through this hub's Madmail relay. What you relay onto another network is readable there."
dm_hint = "Open Delta Chat on your phone or desktop: that is the native app; Messages shows the same conversations as text"
service = "deltachat-rpc-server (the chatmail core, MPL-2.0) and the Madmail relay (AGPL-3.0) are separate programs you install after reading their licences; 111 is not their distributor. The relay serves this hub only (loopback, or the LAN while LAN sharing is on); public chatmail relays and federation are off."

[limits]                                # bytes per text: one JSON-RPC line holds it with room to spare (deltachat.rs MAX_TEXT_BYTES)
dm = 16384
group = 16384
