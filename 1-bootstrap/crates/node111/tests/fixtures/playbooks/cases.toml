# The playbook cases (9-evolution/README.md §6.2, §6.3 "One fixture directory"): grammar v1's accept
# and reject cases, read by node111's tests/heal_playbooks.rs (row D4) and by
# `0-knowledge/_meta/build.py --selftest` (row K1); never in the payload. Row D5 adds the facts cases.
#
# One [[case]] per .md file of this folder: `file`; `verdict`, "accept" or "reject"; for an accept,
# `renders`, the filename its [match] renders (§6.1, N06); for a reject, `rule`, the one rule it
# breaks (node111's `heal::playbook::grammar::Rule` ids). The verdict is the document's: the one
# ```toml fence under the one `### Checks` heading, then grammar v1 against
# 0-knowledge/_meta/playbook-vocabulary.toml. A fixture's own name is its case, never the rendered
# one, and the Layer 0 entry rules (frontmatter, the six H2 sections) are not part of the verdict.
#
# The rules, in the order node111 applies them (each reject case breaks one; the field rules are
# node111's src/daemon/heal/action.rs and src/daemon/heal/playbook/grammar.rs):
#   checks_block   no `### Checks` ATX heading outside a fence, more than one, or its section (to the
#                  next heading of level 1 to 3) not holding exactly one closed fence (``` or ~~~,
#                  3 or more, up to 3 spaces of indent) whose info string is `toml`
#   block_size     the bytes between the two fence lines over 2,048, checked before the parse
#   toml           the block is not TOML (a duplicate key among it)
#   schema         schema missing, not an integer, or not 1 to MAX_SCHEMA (1)
#   value          a TOML date or time anywhere (grammar v1 takes none); then, in the same pass as
#                  the four rules below: anything but a table where grammar v1 takes one ([match],
#                  each [[check]] and [[cause]], a test, each operand of all and any, not's
#                  operand, a cause's action), and an array or a table in a predicate's field or
#                  in severity (serde would read an array as a table's fields in order, and a
#                  one-key table as an enum's name: `test = ["service_state", "model",
#                  "degraded"]`, `is = { degraded = {} }`)
#   unknown_predicate  a `p` that is none of the twelve predicates, all, any, not
#   depth          a check's test deeper than 3 (a leaf is 1, a combinator one more than its deepest)
#   leaves         more than 16 leaves in the whole block
#   unknown_action a cause's `action` name the vocabulary lacks (firmware.flash, update.rollback)
#   unknown_field  a key a table does not take (restarts_at_least's within_events among them)
#   unknown_service  an `id` outside its set: service_state, restarts_at_least, exit_is,
#                  log_contains and service.restart take a supervised child (agent, model,
#                  transport, meshtastic: the vocabulary's child_exit subjects but `any`) or
#                  "@subject"; service_reason any service row or "@subject"
#   subject        a value starting with `@` that is not "@subject" in a subject field (a
#                  component's id, in component_enabled and component.*, takes a literal only)
#   value          a value of the wrong type or out of its bounds; a field, the checks or the causes
#                  missing; an empty all or any (health_is reads ok or error only: of = agent,
#                  is = degraded is refused here)
#   match          [match] not a row of the vocabulary at its own layer
#   ids            a check id not 1 to 16 B or a cause id not 1 to 24 B of a-z, 0-9 and _; an id
#                  twice; a cause named `unknown`; a `when` empty, naming a check twice or one the
#                  block lacks
#   subject        "@subject" in an `any` playbook, or where the [match] subject is not a value the
#                  field takes (a supervised child; for service_reason a service row)
#   unknown_reason a service_reason code the vocabulary lacks for that service row
#   human_only     a cause naming rns.interface.upsert, rns.interface.remove, bridge.edge.pause,
#                  bridge.edge.set, bridge.order.set or identify
#   log_only       a cause whose action is not advise or escalate, none of whose `when` checks
#                  holds a leaf that is not log_contains
schema = 1

