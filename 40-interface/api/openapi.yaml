openapi: 3.1.0
info:
  title: 111 node dashboard API
  version: "1"
  description: |
    Layer 4 contract between the embedded dashboard UI and `111d` (`/api/v1`). Additive-only
    evolution; breaking changes bump the path prefix. Served same-origin by `111d`; `111d` relays
    chat/agent routes to `111-agent` (:11182). See README.md in this folder for conventions
    (auth, problem+json, SSE). The `x-sse-events` map at the bottom types the `/events` stream.
    Layer 5 (Messaging & Data, os/50-messaging/README.md §15) adds messages, contacts, fabric,
    nearby, panels and device identify, all additively. Layer 6 (Transport & Bridge,
    os/60-transport/README.md §10, D27) adds foreign networks and conversations, compose fan-out,
    relay edges, optional components and the transport spine, all additively.
servers:
  - url: http://127.0.0.1:11180
  - url: http://111.localhost
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Node status (superset of /api/status)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/services:
    get:
      operationId: listServices
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, services], properties: { schema: { type: integer, const: 1 }, services: { type: array, items: { $ref: "#/components/schemas/ServiceRecord" } } } } } } }
  /api/v1/services/{id}:
    get:
      operationId: getService
      parameters: [ { $ref: "#/components/parameters/serviceId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRecord" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/services/{id}/log:
    get:
      operationId: getServiceLog
      parameters:
        - { $ref: "#/components/parameters/serviceId" }
        - { name: n, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LogTail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/services/{id}/restart:
    post:
      operationId: restartService
      description: "Restart one child that 111d supervises (`actions` contains `restart`). SIGTERM, grace, SIGKILL, then the supervisor's normal respawn (which also clears `child_degraded` back-off). Supervised today: `agent` (111-agent), `model` (llama-server), `transport` while rnsd runs as a 111d child. Services 111d does not supervise (external daemons such as meshtasticd/opencode, the transport detection-only stub, radio/kb/gateway/codeagent) answer 409 `not_supervised`. Loopback or a paired session, like every write."
      parameters: [ { $ref: "#/components/parameters/serviceId" } ]
      responses:
        "202": { description: Restarting, content: { application/json: { schema: { type: object, required: [schema, id, restarting], properties: { schema: { type: integer }, id: { type: string }, restarting: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: not_supervised, $ref: "#/components/responses/Problem" }
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: Device registry — hardware attached to and devices paired with this node (never other people's nodes)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, devices], properties: { schema: { type: integer }, devices: { type: array, items: { $ref: "#/components/schemas/DeviceRecord" } } } } } } }
  /api/v1/devices/{id}:
    get:
      operationId: getDevice
      parameters: [ { $ref: "#/components/parameters/deviceId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceRecord" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchDevice
      description: Rename (alias null clears). Stored in <root>/state/devices.json keyed by the stable id.
      parameters: [ { $ref: "#/components/parameters/deviceId" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { alias: { type: [string, "null"], maxLength: 64 } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceRecord" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: forgetDevice
      description: Forget — drops alias and pairing record; detected hardware reappears when plugged in again; a companion loses its session.
      parameters: [ { $ref: "#/components/parameters/deviceId" } ]
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/flash:
    post:
      operationId: flashDevice
      summary: Reserved for the Layer 6 core — 111d answers 404 not_found until it lands
      description: "Flash the offered image onto the board. Requires the device's `flash_offer` and a body that repeats the image sha256 and carries the typed confirmation, so a stale offer or a mis-click cannot flash. Loopback or a paired session; CSRF rules apply. Until Layer 6 ships it, 111d has no such route (404 not_found) and the UI says flashing is not available on this node yet."
      parameters: [ { $ref: "#/components/parameters/deviceId" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sha256, confirm], properties: { sha256: { type: string }, confirm: { type: string, description: "the device's displayed name, typed by the user" } } } } } }
      responses:
        "202": { description: Flashing started, content: { application/json: { schema: { type: object, required: [schema, id, flashing], properties: { schema: { type: integer }, id: { type: string }, flashing: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: offer_stale (sha256 mismatch) or already flashing, $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/identify:
    post:
      operationId: identifyDevice
      summary: Consented identify — the Meshtastic step (Layer 5 §14, D17 #8)
      description: "Probe a USB board (Linux) or meshtasticd the user has agreed to have probed (Wi-Fi boards are bound by address in a later task) (`actions` contains `identify`). The body carries the consent flag; without it 400 bad_request. The daemon takes the port from its port-owner table (held by another owner → 409 `port_busy`, nothing is opened), starts meshmud on the port with the identify profile, reads `my_node_info` through the TCP downlink, then answers the updated record: `firmware {family: meshtastic, version, source: probe}`, `driver.stack = meshtastic`, `service_id = meshtastic`, binding persisted in `devices.json`; the identify child becomes the service child in place (never a second open, so a DTR/RTS reset happens at most once, at this consented step). A board that answers but is not Meshtastic returns 200 with the honest `firmware` it did find (family `unknown`), never a guess. Loopback or a paired session, like every write."
      parameters: [ { $ref: "#/components/parameters/deviceId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IdentifyRequest" } } } }
      responses:
        "200": { description: The device record after the probe, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceRecord" } } } }
        "400": { description: bad_request (consent missing or false; the device does not offer `identify`), $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: port_busy (the port has another owner), $ref: "#/components/responses/Problem" }
        "502": { description: "upstream_error: meshmud or the presence reader did not start or did not answer", $ref: "#/components/responses/Problem" }
  /api/v1/chat:
    post:
      operationId: chat
      summary: Relay to 111-agent POST /v1/chat
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatRequest" } } }
      responses:
        "200":
          description: Streamed reply (`stream:true`, default) or JSON (`stream:false`)
          content:
            text/event-stream: { schema: { type: string, description: "Named events: token, tool, done, error — see x-sse-events.chat" } }
            application/json: { schema: { $ref: "#/components/schemas/ChatReply" } }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/chat/history:
    get:
      operationId: chatHistory
      parameters: [ { name: conversation_id, in: query, required: true, schema: { $ref: "#/components/schemas/ConversationId" } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatHistory" } } } }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/status:
    get:
      operationId: agentStatus
      responses:
        "200": { description: Relay of 111-agent /v1/agent/status, content: { application/json: { schema: { $ref: "#/components/schemas/AgentStatus" } } } }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/agent/task:
    post:
      operationId: agentTask
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TaskRequest" } } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { type: object, required: [schema, task_id], properties: { schema: { type: integer }, task_id: { type: string } } } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/proposals:
    get:
      operationId: listProposals
      parameters: [ { name: status, in: query, schema: { type: string, enum: [open, decided, all], default: open } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, proposals], properties: { schema: { type: integer }, proposals: { type: array, items: { $ref: "#/components/schemas/Proposal" } } } } } } }
  /api/v1/proposals/{id}:
    get:
      operationId: getProposal
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { description: "upstream_error: the agent wrote a kind outside the enum", $ref: "#/components/responses/Problem" }
  /api/v1/proposals/{id}/decision:
    post:
      operationId: decideProposal
      description: "Record the human's decision. A `kind: message` proposal is applied on acceptance (Layer 5 §17): its body must be `to: <64 hex>` + a blank line + the text, its node-id stamp must name this node and the recipient must be an accepted contact; then 111d queues the message itself and the decision is recorded (the agent never sends). A refused acceptance answers the problem below and leaves the proposal open; the agent's bearer never decides a message proposal (401). Layer 6: a `bridge_message` proposal runs the fan-out validation on acceptance, a `bridge_edge` proposal the edge-enable consent round-trip, a `device` proposal the apply, probe, revert loop (or the one-shot `identify` / `service.restart`). A consent gate answers 409 `consent_required` with `consent` {text, hash}; the client shows the text and repeats the decision with `accept_warning` = the hash. A refusal leaves the proposal open."
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { $ref: "#/components/schemas/Decision" }, accept_warning: { $ref: "#/components/schemas/Sha256Hex", description: "Layer 6: the hash of the consent text the user was shown (`bridge_edge`, or a `bridge_message` behind a consent gate); absent on the first call" } } } } } }
      responses:
        "200": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { description: "upstream_error: the agent wrote a kind outside the enum, or (kind message) a body that does not follow the `to:` contract or a node-id stamp that does not name this node", $ref: "#/components/responses/Problem" }
        "409": { description: "already_decided; for kind message also bad_request (the recipient is not a contact, or is a pending message request) and restore_pending (the identity holder reports a restore floor, so nothing is sealed yet); Layer 6 adds consent_required (`consent` carries text + hash), oversize and component_unavailable (bridge kinds), unsupported_action (a `device` action outside the four applied and two one-shot actions) and not_supervised (`service.restart` on a child 111d does not supervise) — the proposal stays open", $ref: "#/components/responses/Problem" }
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    patch:
      operationId: patchSettings
      description: Partial merge. `lan_enabled` and `offer` are loopback-only (403 loopback_only otherwise). `lan_enabled` is the single source of truth for LAN sharing (`111 config dashboard.lan` writes the same `state/settings.json`); it takes effect on restart. When the node's environment file pins `DASHBOARD_LAN`, `lan_locked` is true and a patch of `lan_enabled` answers 409 `settings_locked`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsPatch" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: settings_locked, $ref: "#/components/responses/Problem" }
  /api/v1/node/restart:
    post:
      operationId: restartNode
      description: Replies, then the daemon exits 0 and the supervisor restarts it.
      responses:
        "202": { description: Restarting, content: { application/json: { schema: { type: object, required: [schema, restarting], properties: { schema: { type: integer }, restarting: { type: boolean } } } } } }
  /api/v1/update/check:
    post:
      operationId: updateCheck
      description: Wakes the updater loop. Result lands in `/status.update`.
      responses:
        "202": { description: Check started, content: { application/json: { schema: { type: object, required: [schema, started], properties: { schema: { type: integer }, started: { type: boolean } } } } } }
  /api/v1/kb:
    get:
      operationId: kbIndex
      responses:
        "200": { description: Root llms.txt, content: { text/plain: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/kb/entry:
    get:
      operationId: kbEntry
      parameters: [ { name: path, in: query, required: true, schema: { type: string, description: "relative path under share/kb, e.g. projects/meshtastic.md; traversal refused" } } ]
      responses:
        "200": { description: Markdown, content: { text/markdown: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/session:
    get:
      operationId: authSession
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } } }
  /api/v1/auth/pair:
    post:
      operationId: authPair
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, description: "8 chars, dashes/spaces/case ignored" } } } } } }
      responses:
        "200": { description: Session cookie set, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      responses:
        "204": { description: Session revoked }
  # ---- Layer 5: Messaging & Data (50-messaging/README.md §15; additive) ----
  /api/v1/messages/threads:
    get:
      operationId: listThreads
      summary: Conversation list, most recent activity first (including message-request threads)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, threads], properties: { schema: { type: integer }, threads: { type: array, items: { $ref: "#/components/schemas/Thread" } } } } } } }
  /api/v1/messages/threads/{peer}:
    get:
      operationId: getThread
      description: "One conversation, ascending by `local_seq` (receipt sequence — never by claimed time). Without `since_seq` the newest `limit` messages are returned; with it, the first `limit` messages above that sequence. `more` is true when messages exist beyond the window (older ones without `since_seq`, newer ones with it). For a pending message request the held messages are returned read-only (`request: true`); nothing is acknowledged to the sender until the contact is accepted."
      parameters:
        - { $ref: "#/components/parameters/peerId" }
        - { name: since_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, peer, request, messages, more], properties: { schema: { type: integer }, peer: { $ref: "#/components/schemas/NodeId" }, request: { type: boolean, description: "true while the peer is an unaccepted message request" }, messages: { type: array, items: { $ref: "#/components/schemas/Message" } }, more: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/messages:
    post:
      operationId: sendMessage
      description: "Queue a text message to a contact (add them first with POST /contacts). Always 202: the message is `queued` and stays so until a path exists (`reason_code` says why: waiting_for_key, hub_not_yours, restore_pending, store_full) — delivery is never promised by this call. A text that Tier 0/1 framing cannot carry (§5) is refused 400 bad_request, never truncated. Loopback or a paired session; the agent never calls this — it proposes (`kind: message`) and the human accepts in the UI."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SendMessageRequest" } } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, required: [schema, id], properties: { schema: { type: integer }, id: { $ref: "#/components/schemas/MessageId" } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { description: not_found (`to` is not a contact), $ref: "#/components/responses/Problem" }
        "409": { description: "restore_pending: the identity holder reports a restore floor, so nothing is numbered or sealed yet (§4); the message is not queued", $ref: "#/components/responses/Problem" }
  /api/v1/messages/{id}/retry:
    post:
      operationId: retryMessage
      description: "Re-queue an own message that is still `queued` or `sent` (retries otherwise happen on link and contact events, never on timers). Any other state, or an incoming message, answers 409 (`bad_request`)."
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      responses:
        "200": { description: The message after re-queueing, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: not retryable in its current state", $ref: "#/components/responses/Problem" }
  /api/v1/messages/{id}/cancel:
    post:
      operationId: cancelMessage
      description: "Cancel an own message that has not left yet (`queued`, nothing of it sent). An allocated number is never abandoned (§4): an empty placeholder goes in its place, and the message reads `queued` with `reason_code: cancelled` until that leaves. Any other state, or an incoming message, answers 409 (`bad_request`). Loopback or a paired session; the agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/messageId" } ]
      responses:
        "202": { description: The message after cancelling, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: not cancellable in its current state (already sent, or an incoming message)", $ref: "#/components/responses/Problem" }
  /api/v1/contacts:
    get:
      operationId: listContacts
      summary: "Contacts, including pending message requests (`request: true`)"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, contacts], properties: { schema: { type: integer }, contacts: { type: array, items: { $ref: "#/components/schemas/Contact" } } } } } } }
    post:
      operationId: addContact
      description: "Add a contact by `card` (the base32 text of a scanned or pasted card; `trust = oob`, works with zero connectivity) or by `node_id` alone (64 hex or `node1…`; stores the NodeId and asks the home hub for the card — `has_key` stays false and messages stay `queued` with reason_code `waiting_for_key` until the reply verifies against the expected NodeId). Exactly one of the two. A card whose keys conflict with the pinned keys of a known NodeId is rejected 409 (`bad_request`) and never replaces them. An already-known contact is returned unchanged."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContactCreate" } } } }
      responses:
        "200": { description: "The contact (added now, or already known with no state change)", content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: key conflict with the pinned keys for that NodeId", $ref: "#/components/responses/Problem" }
  /api/v1/contacts/me/card:
    get:
      operationId: getOwnCard
      summary: This node's own card (public announce) as text and a QR module bitmap
      description: "This node's current announce, from stored bytes (never minted, §7; re-stored when a settings change alters its roles or home-hub hint). `text` is the base32 form; `qr` is the module matrix the UI draws itself. No key material beyond the public announce."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Card" } } } }
        "409": { description: "restore_pending: the node has no announce yet — nothing is announced until the identity restore completes (§4)", $ref: "#/components/responses/Problem" }
  /api/v1/contacts/{id}:
    get:
      operationId: getContact
      parameters: [ { $ref: "#/components/parameters/contactId" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchContact
      description: "Partial merge: rename (`alias` null clears), accept a pending message request (`accept: true` — creates the contact proper and delivers the held messages to the thread; accepting never ACKs more than the messages shown), pin (a pinned contact is never pruned), mark the thread read."
      parameters: [ { $ref: "#/components/parameters/contactId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContactPatch" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: forgetContact
      description: "Forget the contact (and, for a pending request, discard it). Key material for that NodeId is dropped and its cached pair key zeroized; message history is kept until capacity pruning (§10.4)."
      parameters: [ { $ref: "#/components/parameters/contactId" } ]
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/fabric:
    get:
      operationId: getFabric
      summary: Fabric status — links, home hub, custody, store, settings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FabricStatus" } } } }
  /api/v1/fabric/hub/enroll:
    post:
      operationId: enrollHub
      description: "Member side: enroll with a hub using its one-time code (`ENROLL`, §7.3). The hub's card is needed to seal the request — it rides in `card` when the hub is not already a contact (the hub's offer QR carries card, address and code together). A node has one home hub in v1: enrolling while enrolled answers 409 (`bad_request`). A hub that is unreachable or refuses answers 502 `upstream_error`; the hub's attempt lockout (5 failures) surfaces as 429 `rate_limited`. An attempt that fails or times out leaves nothing behind: the dial it started is released and a hub card pinned only for it is forgotten (a contact that existed before is kept). Success answers the new hub state."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HubEnrollRequest" } } } }
      responses:
        "200": { description: Enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/FabricHub" } } } }
        "400": { description: "bad_request: the body, or an address that names no peer (unspecified, multicast, broadcast; loopback where loopback is never a peer)", $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: this node already has a home hub", $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "502": { description: "upstream_error: the hub is unreachable, did not answer within the wait, or refused the code; or its host name did not resolve", $ref: "#/components/responses/Problem" }
  /api/v1/fabric/hub/offer:
    post:
      operationId: offerHub
      description: "Hub side: mint a one-time enrollment code (8 chars, single use, shown once) plus the hub's card and tcp-lan address as one QR/text bundle (Settings, Let a node use this hub). A new offer invalidates any outstanding code. Loopback-only, like the L4 `offer` (403 loopback_only otherwise)."
      responses:
        "200": { description: Offer minted, content: { application/json: { schema: { $ref: "#/components/schemas/HubOffer" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: this node holds no custody (turn the hub role or custody opt-in on first); restore_pending: no card yet to put in the bundle (§4)", $ref: "#/components/responses/Problem" }
    delete:
      operationId: dismissHubOffer
      description: "Hub side: dismiss the outstanding enrollment code (spec 7.3). Idempotent: 204 whether or not an offer was outstanding. Loopback-only (403 loopback_only otherwise)."
      responses:
        "204": { description: Dismissed }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/fabric/settings:
    patch:
      operationId: patchFabricSettings
      description: "Partial merge of the fabric settings: hub role, LAN listener, custody opt-in, per-class quotas (capacity shaping — there are no per-sender limits; a quota key outside the refusable classes is 400). Loopback-only (403 loopback_only otherwise); `listen_lan` takes effect immediately for new connections."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FabricSettingsPatch" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FabricSettings" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/nearby:
    get:
      operationId: listNearby
      summary: "Presence per source (v1: Meshtastic nodes heard). Names are untrusted RF-origin strings"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, sources], properties: { schema: { type: integer }, sources: { type: array, items: { $ref: "#/components/schemas/NearbySource" } } } } } } }
  /api/v1/panels:
    get:
      operationId: listPanels
      summary: Declared hosted panels and their listener slots (§13)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [schema, panels], properties: { schema: { type: integer }, panels: { type: array, items: { $ref: "#/components/schemas/Panel" } } } } } } }
  /api/v1/panels/{id}/session:
    post:
      operationId: openPanelSession
      description: "Mint a one-time ticket URL for a panel's own origin (128-bit, single use, 30 s). The panel listener swaps it for a host-only `p111_<id>` cookie and redirects to the entry path; a spent or expired ticket without a cookie answers 403 `panel_ticket_expired` on the panel origin (problem+json) and the dashboard re-mints. Behind the dashboard session; on trusted loopback the session is implicit and the ticket is still minted. Bound to the minting session."
      parameters: [ { $ref: "#/components/parameters/panelId" } ]
      responses:
        "200": { description: Ticket minted, content: { application/json: { schema: { $ref: "#/components/schemas/PanelSession" } } } }
        "404": { description: "not_found (unknown panel, or its service is not set up)", $ref: "#/components/responses/Problem" }
  # ---- Layer 6: Transport & Bridge (60-transport/README.md §10; D27; additive) ----
  # Every write below refuses the agent's bearer (401 unauthenticated): the global gate in `require_session`, no allowlist (§13).
  /api/v1/networks:
    get:
      operationId: listNetworks
      summary: "Foreign networks this node can bridge: state, honest copy, caps, counts, dropped-text counter, optional-component facts (§10)"
      description: "One entry per declared adapter, in the user's preferred order (`GET /transport` `order`). A disabled optional component is listed as `state: disabled` with its cached and installed size, so the user sees what enabling costs before any byte is installed (§2.1). The 111 fabric is not a `Network`: its threads are `/messages/threads`."
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: object, required: [schema, networks], properties: { schema: { type: integer }, networks: { type: array, items: { $ref: "#/components/schemas/Network" } } } } } } }
  /api/v1/networks/{net}/conversations:
    get:
      operationId: listForeignConversations
      summary: "Conversations of one network (channels, DMs, groups), most recent activity first"
      description: "Ordered by `last_seq` (the store's receipt sequence), never by a foreign clock. Titles are untrusted foreign text: render as text only."
      parameters: [ { $ref: "#/components/parameters/networkId" } ]
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: object, required: [schema, network, conversations], properties: { schema: { type: integer }, network: { $ref: "#/components/schemas/NetworkId" }, conversations: { type: array, items: { $ref: "#/components/schemas/ForeignConversation" } } } } } } }
        "404": { description: "not_found (no such network)", $ref: "#/components/responses/Problem" }
    post:
      operationId: openForeignConversation
      summary: "Open a foreign DM (from Nearby or a message): `{kind: dm, native_id}`"
      description: "Idempotent: an existing DM with that native id is returned unchanged. `native_id` is the network's own address (`!a1b2c3d4` for Meshtastic, 32 hex for an LXMF destination) and is validated against the adapter's `caps.recipient_syntax`. A foreign DM is never a 111 contact. Only `kind: dm` is accepted (channels come from the board; recipient lists are `PATCH /bridge/settings`). Loopback or a paired session; the agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/networkId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ForeignDmOpen" } } } }
      responses:
        "200": { description: "The conversation (created now, or already known)", content: { application/json: { schema: { $ref: "#/components/schemas/ForeignConversation" } } } }
        "400": { description: "bad_request: `native_id` does not match the network's recipient syntax", $ref: "#/components/responses/Problem" }
        "404": { description: "not_found (no such network)", $ref: "#/components/responses/Problem" }
        "409": { description: "component_unavailable: the network's optional component is not enabled", $ref: "#/components/responses/Problem" }
  /api/v1/networks/{net}/conversations/{conv}:
    get:
      operationId: getForeignConversation
      description: "One conversation, ascending by `seq` (receipt sequence). Without `since_seq` the newest `limit` messages are returned; with it, the first `limit` above that sequence. `more` is true when messages exist beyond the window. Reading never acknowledges anything to the foreign side. Split sends are one row per part (`part`)."
      parameters:
        - { $ref: "#/components/parameters/networkId" }
        - { $ref: "#/components/parameters/foreignConvId" }
        - { name: since_seq, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/ForeignThread" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/networks/{net}/conversations/{conv}/messages:
    post:
      operationId: sendForeignMessage
      summary: "Send a text into one foreign conversation (always a human act in the UI)"
      description: "Queues one row (or one row per part with `size_mode: split`) and answers 202 `{id, plan}`; delivery is never promised: adapter state (region unset, board away, queue full, no path) queues the row with a `reason_code`. A text over the network's cap in `refuse` mode (the default) answers 409 `oversize` and queues nothing; a consent gate (`ham_unconfirmed`, `uplink_off`) answers 409 `consent_required` carrying the exact text and its hash (confirm via `PATCH /bridge/settings`, then send again). The text is a copy: no 111 message is exported. Loopback or a paired session; the agent's bearer is refused (401); the agent proposes (`kind: bridge_message`)."
      parameters:
        - { $ref: "#/components/parameters/networkId" }
        - { $ref: "#/components/parameters/foreignConvId" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ForeignSendRequest" } } } }
      responses:
        "202": { description: "Queued", content: { application/json: { schema: { $ref: "#/components/schemas/ForeignSendAccepted" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "oversize (refuse mode), consent_required (ham_unconfirmed / uplink_off; `consent` carries text + hash), component_unavailable", $ref: "#/components/responses/Problem" }
  /api/v1/messages/fanout/preview:
    post:
      operationId: previewFanout
      summary: "Dry run of a compose fan-out: per-target bytes, cap, parts, airtime estimate, refusals (§9)"
      description: "Writes nothing, transmits nothing and does not log the text. Every target gets a `plan`; a target that would be refused carries `plan.refusal`. Airtime is an estimate and labelled one. Loopback or a paired session; the agent's bearer is refused (401)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FanoutRequest" } } } }
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/FanoutPreview" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { description: "not_found (a target names no conversation or contact)", $ref: "#/components/responses/Problem" }
  /api/v1/messages/fanout:
    post:
      operationId: sendFanout
      summary: "Send one text to many targets as a fresh send group (§9)"
      description: "Validation is atomic: if any target is refused for `oversize` in `refuse` mode or for a consent gate (`ham_unconfirmed`, `uplink_off`), the answer is 409 with the per-target report in `targets` and nothing is queued. Adapter state (region unset, board away, queue full, no path) is not a call error: rows queue with their reason. 111 targets are ordinary sealed messages (`msg-…` ids, Layer 5 states); foreign targets are `fm-…` rows. Each row has its own state, retry and cancel; one target's failure never cancels another. Loopback or a paired session; the agent's bearer is refused (401)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FanoutRequest" } } } }
      responses:
        "202": { description: "Queued", content: { application/json: { schema: { $ref: "#/components/schemas/FanoutResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "per-target refusal, nothing queued: code `oversize` or `consent_required`; `targets` lists every refused target with its own code, detail and (for a consent gate) `consent`", $ref: "#/components/responses/Problem" }
  /api/v1/bridge/edges:
    get:
      operationId: listBridgeEdges
      summary: "Relay edges (explicit, directed, non-transitive copies from one conversation to another, §8)"
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: object, required: [schema, edges], properties: { schema: { type: integer }, edges: { type: array, items: { $ref: "#/components/schemas/BridgeEdge" } } } } } } }
    post:
      operationId: createBridgeEdge
      summary: "Enable a relay edge (only a human on a paired or loopback session)"
      description: "Both endpoints are `channel` or `group` conversations and differ; a DM endpoint is 400 `bad_request`. Without `accept_warning` the answer is 409 `consent_required` carrying the exact warning text and its hash (`consent`); the client shows the text and repeats the request with `accept_warning` = that hash. History is never relayed: `cursor_seq` is set at enable. Accepting a `bridge_edge` proposal (`POST /proposals/{id}/decision`) runs the same round-trip. The agent's bearer is refused (401)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BridgeEdgeCreate" } } } }
      responses:
        "201": { description: "Edge enabled", content: { application/json: { schema: { $ref: "#/components/schemas/BridgeEdge" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { description: "not_found (an endpoint names no conversation)", $ref: "#/components/responses/Problem" }
        "409": { description: "consent_required (no or stale `accept_warning`), component_unavailable (an endpoint's adapter is not enabled), bad_request (the same pair is already an edge)", $ref: "#/components/responses/Problem" }
  /api/v1/bridge/edges/{id}:
    get:
      operationId: getBridgeEdge
      parameters: [ { $ref: "#/components/parameters/edgeId" } ]
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/BridgeEdge" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchBridgeEdge
      description: "Partial merge: `paused` (pausing is always allowed; resuming a `consent_paused` edge answers 409 `consent_required` with the NEW text and hash until `accept_warning` echoes it), `honour_ok_to_mqtt`, `oversize`. The agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/edgeId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BridgeEdgePatch" } } } }
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/BridgeEdge" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "consent_required (resume without a current `accept_warning`)", $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBridgeEdge
      description: "Remove the edge. Copies already queued on the destination stay (they are ordinary own rows); no new copy is made. The agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/edgeId" } ]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/bridge/settings:
    get:
      operationId: getBridgeSettings
      summary: "Adapters on/off, preferred order, recipient lists, per-channel send switches, HAM confirmations (state/bridge.json)"
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/BridgeSettings" } } } }
    patch:
      operationId: patchBridgeSettings
      description: "Partial merge. A HAM confirmation or an uplinked channel's send switch is never a bare patch: without `accept_warning` the answer is 409 `consent_required` carrying the exact text and its hash, repeated with the hash to confirm; the confirmation is recorded with the text hash. Turning an adapter that is an optional component on goes through `POST /bridge/components/{id}/enable`, not here. The agent's bearer is refused (401)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BridgeSettingsPatch" } } } }
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/BridgeSettings" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "consent_required (HAM confirmation or uplinked-channel send switch without a current `accept_warning`), component_unavailable", $ref: "#/components/responses/Problem" }
  /api/v1/bridge/components:
    get:
      operationId: listBridgeComponents
      summary: "Optional third-party components: declared, cached, installed, running (§2.1)"
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: object, required: [schema, components], properties: { schema: { type: integer }, components: { type: array, items: { $ref: "#/components/schemas/Component" } } } } } } }
  /api/v1/bridge/components/{id}/enable:
    post:
      operationId: enableBridgeComponent
      description: "Install from the install-time cache (offline; nothing downloads at runtime), start, health. Without `accept_notice_hash` the answer is 409 `consent_required` carrying the licence notice (program, licence, where to read it, cached size) and its hash; the client shows it and repeats the request with the hash, which `state/bridge.json` records (the user installs, 111 is not the distributor). A payload missing from the cache or failing its pin, or a failed `[requires]` check, answers 409 `component_unavailable` and installs nothing (fail closed). Loopback or a paired session; the agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/componentId" } ]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/ComponentEnableRequest" } } } }
      responses:
        "200": { description: "The component after enabling", content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "consent_required (no or stale `accept_notice_hash`), component_unavailable", $ref: "#/components/responses/Problem" }
  /api/v1/bridge/components/{id}/disable:
    post:
      operationId: disableBridgeComponent
      description: "Stop the child and release its ports and claims. Installed files and the cached payload stay (a re-enable is offline and instant); `remove-files` deletes them. Idempotent. The agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/componentId" } ]
      responses:
        "200": { description: "The component after disabling", content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/bridge/components/{id}/remove-files:
    post:
      operationId: removeBridgeComponentFiles
      description: "Delete the installed tree and the adapter's state (`bridge/<adapter>/`, a Delta Chat account store included); with `cache: true` also the cached payload. Nothing is deleted without this call. A running component answers 409 `bad_request` (disable it first). The agent's bearer is refused (401)."
      parameters: [ { $ref: "#/components/parameters/componentId" } ]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/ComponentRemoveRequest" } } } }
      responses:
        "200": { description: "The component after removal", content: { application/json: { schema: { $ref: "#/components/schemas/Component" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: the component is running", $ref: "#/components/responses/Problem" }
  /api/v1/transport:
    get:
      operationId: getTransport
      summary: "Transport facts: interfaces from the cached rnstatus, posture, region, callsign, preferred order (§11)"
      description: "Interface facts come from a tick-driven cache of `rnstatus` through the shared instance, never the request path (`interfaces_state` says whether the cache is fresh). No credential appears here: the IFAC passphrase is only on `POST /transport/join`."
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/TransportStatus" } } } }
  /api/v1/transport/posture:
    patch:
      operationId: patchTransportPosture
      description: "Partial merge of the rnsd posture, the radio region and callsign, and the preferred network order, applied through the narrow apply, probe, revert loop (§12): snapshot `interfaces.toml` and the rendered config, apply, probe within 30 s, keep or revert. A reverted change answers 200 with `reverted: true` and the reason; the previous posture is live. A posture change restarts rnsd with its children in order. An unknown region is 400 `bad_request`. Loopback or a paired session; the agent's bearer is refused (401); the agent proposes (`kind: device`)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransportPosturePatch" } } } }
      responses:
        "200": { description: "The outcome and the transport facts after it", content: { application/json: { schema: { $ref: "#/components/schemas/TransportPostureResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { description: "bad_request: another change is applying", $ref: "#/components/responses/Problem" }
  /api/v1/transport/join:
    post:
      operationId: joinTransport
      summary: "The phone-relay join descriptor (address, port, IFAC name and passphrase if set)"
      description: "A POST because it returns a credential and the agent's bearer reads every GET: this route is `no-store`, refuses the bearer (401) like every non-GET, and is served only on a paired or loopback session. Used by a phone's `111d` after the QR pair-code ceremony to write its own `TCPClientInterface` entry; the passphrase never rides in the QR. 409 `bad_request` while LAN sharing is off (no Backbone listener to join). The IFAC passphrase is a shared network credential, not identity key material."
      responses:
        "200": { description: "The descriptor", headers: { Cache-Control: { schema: { type: string, enum: [no-store] }, description: "always `no-store`: the body carries a credential" } }, content: { application/json: { schema: { $ref: "#/components/schemas/TransportJoin" } } } }
        "409": { description: "bad_request: LAN sharing is off, or this node is not a relay", $ref: "#/components/responses/Problem" }
  /api/v1/events:
    get:
      operationId: events
      description: The one live stream. `id:` global monotonic; honors Last-Event-ID (ring 256) else emits `reset`. See x-sse-events.events.
      responses:
        "200": { description: text/event-stream, content: { text/event-stream: { schema: { type: string } } } }
components:
  parameters:
    serviceId: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ServiceId" } }
    deviceId: { name: id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{4,64}$" } }
    peerId: { name: peer, in: path, required: true, schema: { $ref: "#/components/schemas/NodeId" } }
    contactId: { name: id, in: path, required: true, description: "the contact's `node_id`", schema: { $ref: "#/components/schemas/NodeId" } }
    messageId: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/MessageId" } }
    panelId: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ServiceId" } }
    networkId: { name: net, in: path, required: true, description: "a network id; the colon of `app:…` is percent-encoded", schema: { $ref: "#/components/schemas/NetworkId" } }
    foreignConvId: { name: conv, in: path, required: true, schema: { $ref: "#/components/schemas/ForeignConversationId" } }
    edgeId: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/BridgeEdgeId" } }
    componentId: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/ComponentId" } }
  responses:
    Problem: { description: problem+json, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [unauthenticated, loopback_only, lan_read_only, agent_unavailable, model_unavailable, bad_request, not_found, rate_limited, already_decided, not_supervised, settings_locked, offer_stale, needs_hub, upstream_error, internal, port_busy, panel_ticket_expired, restore_pending, consent_required, oversize, component_unavailable, unsupported_action]
        errors: { type: array, items: { type: object, required: [message], properties: { pointer: { type: string }, message: { type: string } } } }
        consent: { $ref: "#/components/schemas/ConsentRequired", description: "Layer 6 extension member (RFC 9457): present on `consent_required`; the exact text and its hash to echo back" }
        targets: { type: array, items: { $ref: "#/components/schemas/TargetRefusal" }, description: "Layer 6 extension member: the per-target report of a refused fan-out (409 `oversize` or `consent_required`); nothing was queued" }
    ServiceId: { type: string, enum: [agent, model, transport, radio, kb, gateway, codeagent, fabric, meshtastic] }
    ServiceState: { type: string, enum: [live, unset, error, starting] }
    ServiceRecord:
      type: object
      required: [id, name, plain_name, kind, state, since, reason_code, reason, can_run_here, description, actions, detail]
      properties:
        id: { $ref: "#/components/schemas/ServiceId" }
        name: { type: string, description: "technical name, e.g. 111-agent" }
        plain_name: { type: string, description: "e.g. Local AI agent" }
        kind: { type: string, enum: [child, detected, builtin] }
        state: { $ref: "#/components/schemas/ServiceState" }
        since: { type: string, format: date-time }
        reason_code: { type: string, description: "stable snake_case, display-only for clients. Emitted set (111d): healthy, health_pending, spawn_pending, child_degraded, child_stopped, child_backoff, health_error, health_503, health_unreachable, binary_absent, no_model, no_python, venv_unavailable, transport_degraded, joined, isolated, no_radio, radio_unbound, radio_bound_rnode, radio_bound_meshtastic, stack_waiting, stack_down, verify_failed, kb_absent, wan_ok, wan_unknown, wan_offline, not_hub, opencode_found, opencode_absent. Layer 5 adds: store_full (fabric), port_busy (meshtastic); fabric and meshtastic rows add their own snake_case codes, additively." }
        reason: { type: string, description: "one plain sentence" }
        can_run_here: { type: boolean }
        requires: { type: string }
        description: { type: string, description: "2–3 plain sentences: what it is" }
        kb_entry: { type: string, description: "relative KB path" }
        embed_url: { type: string, description: "link-out URL. Never set when `panel` is non-null" }
        panel: { oneOf: [ { $ref: "#/components/schemas/Panel" }, { type: "null" } ], description: "Layer 5 (§13): the hosted panel for this service's LIVE page, or null. Additive: absent on older daemons" }
        actions: { type: array, items: { type: string, enum: [restart, log] } }
        detail: { type: object, additionalProperties: true }
    Status:
      type: object
      required: [schema, node, transport_state, health, update, intelligence, bind, lan_enabled, auth, layers]
      properties:
        schema: { type: integer }
        node:
          type: object
          required: [node_id, label, bech32, alias, category, version, uptime_sec]
          properties:
            node_id: { type: [string, "null"], description: "64 lowercase hex" }
            label: { type: [string, "null"], description: "xxxx-xxxx-xx operator label (display only)" }
            bech32: { type: [string, "null"], description: "node1… (lowercase)" }
            alias: { type: [string, "null"], description: "local editable name" }
            category: { type: [string, "null"], enum: [Relay1, Node2A, Node2B, Bridge3, Hub4A, Hub4B, null] }
            version: { type: string }
            uptime_sec: { type: integer }
        kb: { type: [object, "null"], properties: { sha256: { type: string }, entries: { type: integer } } }
        transport_state: { type: string, enum: ["no transport", isolated, joined, "transport degraded"] }
        health:
          type: object
          properties:
            status: { type: string, enum: [ok, error] }
            components: { type: object, properties: { identity: { type: boolean }, kb: { type: boolean }, transport: { type: string, enum: [alive, absent, degraded, down] }, updater_idle: { type: boolean } } }
        update:
          type: object
          required: [state, pending, last_check, clock_fault]
          properties:
            state: { type: string, enum: [idle, checking, staged, probation, reverting, failed] }
            pending: { type: boolean }
            pending_version: { type: [string, "null"] }
            last_check: { type: [string, "null"], format: date-time }
            last_result: { type: [string, "null"], enum: [up_to_date, staged, refused, degraded, null] }
            floor: { type: [string, "null"] }
            clock_fault: { type: boolean }
        offer: { type: [object, "null"], properties: { tier: { type: string }, state: { type: string, enum: [offered, accepted, dismissed] } } }
        error_state: { type: [object, "null"], properties: { kind: { type: string }, detail: { type: string } } }
        intelligence:
          type: object
          properties:
            agent: { $ref: "#/components/schemas/ChildState" }
            model_server: { $ref: "#/components/schemas/ChildState" }
            agent_url: { type: [string, "null"] }
            agent_state: { type: [string, "null"], enum: [local, offloaded, unavailable, null] }
            model_id: { type: [string, "null"] }
        bind:
          type: object
          required: [urls, lan]
          properties:
            urls: { type: array, items: { type: string }, description: "URLs that actually bound, nicest first" }
            lan: { type: boolean }
        lan_enabled: { type: boolean, description: "configured value (takes effect on restart)" }
        auth:
          type: object
          required: [loopback, paired]
          properties: { loopback: { type: boolean }, paired: { type: boolean } }
        layers:
          type: array
          description: "layers this node runs right now (0 needs the KB payload verified, 2 needs identity ok, 3 needs the agent binary, 5 needs the message fabric running and not restore_pending, 1 and 4 always)"
          items: { type: integer, minimum: 0, maximum: 9 }
    ChildState: { type: string, enum: [absent, running, backoff, degraded, stopped] }
    LogTail:
      type: object
      required: [schema, service, lines, source]
      properties:
        schema: { type: integer }
        service: { $ref: "#/components/schemas/ServiceId" }
        source: { type: string, description: "file path or 'none'" }
        lines: { type: array, items: { type: string } }
    ConversationId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    ChatRequest:
      type: object
      required: [conversation_id, message]
      properties:
        conversation_id: { $ref: "#/components/schemas/ConversationId" }
        message: { type: string, minLength: 1, maxLength: 16000 }
        stream: { type: boolean, default: true }
    ChatReply:
      type: object
      required: [schema, conversation_id, reply, tool_trace]
      properties:
        schema: { type: integer }
        conversation_id: { type: string }
        reply: { type: string }
        tool_trace: { type: array, items: { $ref: "#/components/schemas/ToolTrace" } }
    ToolTrace: { type: object, required: [name, ok], properties: { name: { type: string }, ok: { type: boolean } } }
    ChatHistory:
      type: object
      required: [schema, conversation_id, messages]
      properties:
        schema: { type: integer }
        conversation_id: { type: string }
        messages:
          type: array
          description: raw OpenAI-shaped messages from 111-agent; UI hides role=tool and null-content assistant rows
          items:
            type: object
            required: [role]
            properties:
              role: { type: string, enum: [user, assistant, tool, system] }
              content: { type: [string, "null"] }
              tool_calls: { type: array, items: { type: object, additionalProperties: true } }
    AgentStatus:
      type: object
      properties:
        schema: { type: integer }
        state: { type: string, enum: [local, offloaded, unavailable] }
        model: { type: object, properties: { base: { type: string }, reachable: { type: boolean }, id: { type: string } } }
        kb: { type: object, properties: { present: { type: boolean }, entries: { type: integer } } }
        conversations: { type: integer }
        tasks_open: { type: integer }
        uptime_sec: { type: integer }
        version: { type: string }
        node_id: { type: [string, "null"] }
        category: { type: string }
    TaskRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [diagnose, propose, patch] }
        refs: { type: array, items: { type: string } }
        note: { type: [string, "null"] }
    Decision: { type: string, enum: [accepted, dismissed] }
    Proposal:
      type: object
      required: [schema, id, node_id, task_id, kind, title, body, created_at, decision]
      properties:
        schema: { type: integer }
        id: { type: string }
        node_id: { type: [string, "null"] }
        task_id: { type: [string, "null"] }
        kind: { type: string, enum: [diagnose, propose, patch, chat, message, bridge_message, bridge_edge, device], description: "Layer 6 adds `bridge_message` (body: `to: <fc-id>` lines, a blank line, then the text verbatim; accepting runs the fan-out validation and, if a consent gate applies, the 409 `consent_required` round-trip), `bridge_edge` (body: a `from: <fc-id>` line and a `to: <fc-id>` line, then the agent's reason; accepting runs the edge-enable consent round-trip) and `device` (body: one JSON object `{\"why\": string, \"actions\": [Action]}` where an Action is `{\"action\": name, …args}` from the closed vocabulary `rns.interface.upsert {device_id, type, params}`, `rns.interface.remove {name}`, `rns.posture.set {share_instance, enable_transport}`, `radio.region.set {region}`, plus the one-shots `identify {device_id}` and `service.restart {service_id}`; 111d validates, applies, probes and reverts; the other vocabulary entries are refused `unsupported_action`; a body that is not that shape is 502 `upstream_error`). RENDERING RULE: the text part of a `bridge_message` or `bridge_edge` body quotes foreign, untrusted text and is rendered as a preformatted text block, never as Markdown (no links, no emphasis); `device` bodies render as a card from the parsed JSON. Layer 5 adds `message` (§17 `messages.send`): the body is exactly `to: <64 lowercase hex>` + a blank line + the text verbatim; accepting it (POST /proposals/{id}/decision) makes 111d send it — only to an accepted contact and only when the proposal's `node_id` names this node — and the decision is recorded after the store committed the message" }
        title: { type: string }
        body: { type: string, description: markdown }
        created_at: { type: string, format: date-time }
        decision: { type: [object, "null"], properties: { decision: { $ref: "#/components/schemas/Decision" }, at: { type: string, format: date-time } } }
    Settings:
      type: object
      required: [schema, alias, lan_enabled, lan_locked, offer]
      properties:
        schema: { type: integer }
        alias: { type: [string, "null"], maxLength: 64 }
        lan_enabled: { type: boolean, description: "effective value: settings.json, or the DASHBOARD_LAN override when lan_locked" }
        lan_locked: { type: boolean, description: "true when DASHBOARD_LAN in the node's environment file overrides settings.json; the UI disables the toggle" }
        offer: { type: [string, "null"], enum: [offered, accepted, dismissed, null] }
    SettingsPatch:
      type: object
      properties:
        alias: { type: [string, "null"], maxLength: 64 }
        lan_enabled: { type: boolean }
        offer: { type: string, enum: [accepted, dismissed] }
    AuthSession:
      type: object
      required: [schema, loopback, paired, lan_enabled]
      properties:
        schema: { type: integer }
        loopback: { type: boolean }
        paired: { type: boolean }
        lan_enabled: { type: boolean }
        created: { type: [string, "null"], format: date-time }
        loopback_trusted: { type: boolean, description: "policy: loopback peers are authenticated without pairing (false under Termux/Android or DASHBOARD_TRUST_LOOPBACK=false)" }
        device_id: { type: [string, "null"], description: "the companion DeviceRecord id of the caller's own paired session, so the UI can say 'this browser' before forgetting it; null on loopback-trusted or unpaired calls" }
    # ---- SSE payloads (referenced by x-sse-events) ----
    SseChatToken: { type: object, required: [text], properties: { text: { type: string } } }
    SseChatTool: { type: object, required: [name], properties: { name: { type: string } } }
    SseChatDone: { type: object, required: [conversation_id, reply, tool_trace], properties: { conversation_id: { type: string }, reply: { type: string }, tool_trace: { type: array, items: { $ref: "#/components/schemas/ToolTrace" } } } }
    SseChatError: { type: object, required: [error], properties: { error: { type: string }, code: { type: string } } }
    SseAgentEvent:
      type: object
      required: [schema, seq, ts, kind, detail]
      properties:
        schema: { type: integer }
        seq: { type: integer }
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [chat.turn, task.submitted, task.done, task.failed, task.refused, task.orphaned, proposal.written] }
        detail: { type: object, additionalProperties: true }
    SseProposal:
      type: object
      required: [id, title, kind, created_at]
      description: "Fired when a proposal file appears AND when a decision is recorded (so other tabs refresh); `decision` is null for a new proposal."
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string }
        created_at: { type: string, format: date-time }
        decision: { type: [object, "null"], properties: { decision: { $ref: "#/components/schemas/Decision" }, at: { type: string, format: date-time } } }
    SseReset: { type: object, required: [reason], properties: { reason: { type: string, enum: [expired, restart] } } }
    DeviceKind: { type: string, enum: [radio, bluetooth, companion, node, analog, unknown] }
    DeviceState: { type: string, enum: [connected, disconnected, needs_setup, error] }
    DeviceTransport: { type: string, enum: [usb-serial, spi, bluetooth, wifi, lan, tcp, audio, unknown] }
    DeviceMatch:
      type: object
      required: [confidence, rule]
      description: "How the record was identified. USB VID:PID names the serial chip, not the board or its firmware (os/plan/cross-layer/devices.md §0): table matches are 'likely' until a consented probe confirms."
      properties:
        confidence: { type: string, enum: [exact, likely, unknown] }
        rule: { type: string, description: "e.g. lora-table 303a:1001, serial-by-id, session, probe" }
    DeviceFirmware:
      type: object
      required: [family, version, source]
      properties:
        family: { type: string, enum: [rnode, meshtastic, meshcore, kiss, none, unknown] }
        version: { type: [string, "null"] }
        source: { type: string, enum: [probe, user, agent, unknown] }
    FlashOffer:
      type: object
      required: [reason, image, erases]
      description: "An offer to flash firmware, decided by a human in the dashboard (D17: human-confirmed only; images ship inside the signed release; no runtime downloads)."
      properties:
        reason: { type: string, enum: [blank, unknown], description: "blank: no firmware answered; unknown: something answered but nothing we can drive" }
        image:
          type: object
          required: [family, version, file, sha256, board]
          properties:
            family: { type: string, enum: [rnode] }
            version: { type: string }
            file: { type: string, description: "path inside the signed release, e.g. share/firmware/rnode-heltec-v3-1.78.bin" }
            sha256: { type: string, description: "hex; pinned in the release manifest" }
            board: { type: string, description: "human board name the image targets" }
        erases: { type: string, description: "plain-language statement of what is lost (e.g. 'everything on the board, including any Meshtastic settings')" }
    DeviceDriver:
      type: object
      required: [stack, interface, live]
      description: "What drives this device right now. A USB Meshtastic board is NOT driven by meshtasticd (SPI HATs only); it is driven by rnsd's RNodeInterface (RNode firmware) or a Meshtastic client, or nothing yet."
      properties:
        stack: { type: [string, "null"], enum: [reticulum, meshtastic, meshcore, dashboard, null] }
        interface: { type: [string, "null"], description: "e.g. rnsd interface name, 'meshtasticd', 'session'" }
        live: { type: boolean }
    DeviceRecord:
      type: object
      required: [id, kind, alias, name, state, transport, first_seen, last_seen, since, reason_code, reason, capabilities, identity, actions, detail]
      properties:
        id: { type: string, description: "stable across reboots (hash of serial-by-id path / vendor:product:serial / BLE MAC / companion session id)" }
        since: { type: string, format: date-time, description: "when the published state last changed" }
        kind: { $ref: "#/components/schemas/DeviceKind" }
        alias: { type: [string, "null"], description: "user-given name" }
        name: { type: string, description: "detected product name or a plain fallback like 'USB serial device'" }
        state: { $ref: "#/components/schemas/DeviceState" }
        transport: { $ref: "#/components/schemas/DeviceTransport" }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        reason_code: { type: string, description: "stable snake_case, display-only for clients. Emitted set (111d): stack_bound, stack_down, radio_unbound, unbound, no_port_access, adapter_idle, unidentified, session_active, session_idle, unplugged, not_detected. Layer 5 adds: port_busy (the port has another owner, so identify is refused)." }
        reason: { type: string, description: "one plain sentence" }
        capabilities: { type: array, items: { type: string }, description: "e.g. lora, meshtastic-firmware, ble, dashboard-session" }
        service_id: { $ref: "#/components/schemas/ServiceId", description: "the registry service this device belongs to, if any" }
        match: { $ref: "#/components/schemas/DeviceMatch" }
        firmware: { oneOf: [ { $ref: "#/components/schemas/DeviceFirmware" }, { type: "null" } ] }
        driver: { oneOf: [ { $ref: "#/components/schemas/DeviceDriver" }, { type: "null" } ] }
        role: { type: [string, "null"], enum: [controller, terminal, relay, node, null], description: "companions only: what this paired device does for the node (v1: controller)" }
        kb_entry: { type: string }
        identity:
          type: object
          additionalProperties: true
          description: "vendor_id, product_id, serial, port, mac, ip, user_agent — whatever was detected; untrusted strings"
        actions: { type: array, items: { type: string, enum: [rename, forget, agent, identify, pair, authorize, flash] }, description: "identify is live for Meshtastic-capable boards (Layer 5 §14; POST /devices/{id}/identify); pair/authorize/flash are reserved for the Layer 6 core; clients render unknown values as disabled. `flash` appears only with a non-null `flash_offer`." }
        flash_offer: { oneOf: [ { $ref: "#/components/schemas/FlashOffer" }, { type: "null" } ], description: "Layer 6 (D17): present only for a board with no usable firmware (family none/unknown) when the signed release carries an image for it. Never for a board that already runs something." }
        detail: { type: object, additionalProperties: true, description: "raw detection facts the panel renders; bounded" }
    SseDevices: { type: object, required: [devices], properties: { devices: { type: array, items: { $ref: "#/components/schemas/DeviceRecord" } } } }
    SseServices: { type: object, required: [services], properties: { services: { type: array, items: { $ref: "#/components/schemas/ServiceRecord" } } } }
    # ---- Layer 5: Messaging & Data (50-messaging/README.md §3–§15; additive) ----
    NodeId: { type: string, pattern: "^[0-9a-f]{64}$", description: "a public NodeId, 64 lowercase hex; `label` and `bech32` are its display forms" }
    MessageId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", description: "`msg-…`, minted by 111d for the local row. Not the wire msg_id (§4), which only Advanced views show (`Message.msg_id`)" }
    MessageState:
      type: string
      enum: [queued, sent, relayed, delivered]
      description: "Delivery evidence (§9), own messages only. queued: no path, key missing, or the peer's hub is not yours (see `reason_code`). sent: a frame was written to a link, or a custody reject kept it here (see `reason_code`). relayed: an authenticated CUSTODY_ACK from a mailbox node for a known member — saved and held for them, not yet at them. delivered: the recipient's own ACK. Only that ACK releases the sender's copy."
    ContactTrust:
      type: string
      enum: [oob, tofu, enrolled]
      description: "How the keys were learned (§7.1). oob: a card or QR, or a NodeId typed or scanned out of band. tofu: first seen through an INTRO (a message request until accepted). enrolled: hub and member after ENROLL."
    Message:
      type: object
      required: [id, peer, dir, text, state, reason_code, reason, local_seq, received_seq, sent_at_claim, at]
      description: "One message in a thread. Order is `local_seq`; `at` and `sent_at_claim` are display only and never order anything (no timestamp exists in the envelope, §4)."
      properties:
        id: { $ref: "#/components/schemas/MessageId" }
        peer: { $ref: "#/components/schemas/NodeId", description: "the other party: the recipient for dir=own, the sender for dir=in" }
        dir: { type: string, enum: [own, in] }
        text: { type: string, description: "message body text. For dir=in this is peer-authored and untrusted: render as text only" }
        state: { $ref: "#/components/schemas/MessageState", description: "dir=in is always `delivered` (it arrived here; a held message request is not acknowledged to its sender until accepted)" }
        reason_code: { type: [string, "null"], description: "stable snake_case, display-only for clients, set while the state needs an explanation. Emitted set (111d): waiting_for_key (queued, the peer's card has not arrived), hub_not_yours (queued while your hub is unreachable and their card names another hub; or sent after your hub answered REJECT_UNKNOWN_DEST — your hub does not know them, §9; either way delivered when you meet directly), restore_pending (queued, the identity holder reports a restore floor so nothing is sealed), store_full (queued, the local store refuses new work), mailbox_full (sent, the hub answered REJECT_FULL), not_enrolled (sent, the hub answered REJECT_UNENROLLED: it no longer lists this node), cancelled (queued, the user cancelled it before it left; an empty placeholder goes instead so no number is abandoned, §4). null when nothing needs explaining." }
        reason: { type: [string, "null"], description: "one plain sentence for `reason_code`" }
        local_seq: { type: integer, minimum: 0, description: "local ordering sequence of the thread (the store's `local_seq`); strictly increasing per node" }
        received_seq: { type: [integer, "null"], minimum: 0, description: "local receipt sequence for dir=in; null for own messages" }
        sent_at_claim: { type: [string, "null"], format: date-time, description: "the sender's own claim (`sent_at` in the body, §3.3), unverified: show it as such, behind a disclosure. null when absent or for own messages" }
        at: { type: string, format: date-time, description: "local wall-clock time this node stored the message (own: queued; in: received). Display only" }
        msg_id:
          type: object
          required: [stream, epoch, n]
          description: "Advanced view: the wire msg_id components (§4); the sender and recipient are `peer` and this node"
          properties: { stream: { type: integer, minimum: 0 }, epoch: { type: integer, minimum: 0 }, n: { type: integer, minimum: 0 } }
    ThreadStates:
      type: object
      required: [queued, sent, relayed, delivered]
      description: "Counts of this thread's own messages per delivery state"
      properties: { queued: { type: integer, minimum: 0 }, sent: { type: integer, minimum: 0 }, relayed: { type: integer, minimum: 0 }, delivered: { type: integer, minimum: 0 } }
    Thread:
      type: object
      required: [peer, alias, label, request, unread, last, states]
      properties:
        peer: { $ref: "#/components/schemas/NodeId" }
        alias: { type: [string, "null"], maxLength: 64 }
        label: { type: string, description: "xxxx-xxxx-xx operator label of `peer` (display only)" }
        request: { type: boolean, description: "true while the peer is an unaccepted message request (INTRO): accept or leave it pending" }
        unread: { type: integer, minimum: 0, description: "incoming messages above the thread's read mark (`ContactPatch.read_seq`)" }
        last: { oneOf: [ { $ref: "#/components/schemas/Message" }, { type: "null" } ], description: "the most recent message by `local_seq`" }
        states: { $ref: "#/components/schemas/ThreadStates" }
    SendMessageRequest:
      type: object
      required: [to, text]
      properties:
        to: { $ref: "#/components/schemas/NodeId", description: "a contact's `node_id`" }
        text: { type: string, minLength: 1, description: "the message text. Refused (400) when Tier 0/1 framing cannot carry it (§5); attachments arrive in v1.1" }
    Contact:
      type: object
      required: [node_id, bech32, label, alias, trust, request, pinned, has_key]
      properties:
        node_id: { $ref: "#/components/schemas/NodeId" }
        bech32: { type: string, pattern: "^node1[a-z0-9]+$", description: "node1… (lowercase)" }
        label: { type: string, description: "xxxx-xxxx-xx operator label (display only)" }
        alias: { type: [string, "null"], maxLength: 64, description: "local editable name" }
        trust: { $ref: "#/components/schemas/ContactTrust" }
        request: { type: boolean, description: "pending message request: its messages are held and not acknowledged until accepted" }
        pinned: { type: boolean, description: "never pruned" }
        has_key: { type: boolean, description: "false while only the NodeId is known and the card request is outstanding; messages to them are queued with reason_code waiting_for_key" }
        roles: { type: array, items: { type: string }, description: "from the contact's announce appdata (§7.3), e.g. mailbox, always_on_hub, lora_attached. Unknown values are ignored" }
        home_hub: { type: [string, "null"], description: "locator hint from appdata: the contact's home hub id, truncated hex. Never an authenticator" }
    ContactAddByCard:
      type: object
      required: [card]
      properties: { card: { type: string, minLength: 1, description: "base32 card text as scanned or pasted (§7.2 (1))" } }
    ContactAddByNodeId:
      type: object
      required: [node_id]
      properties: { node_id: { type: string, minLength: 1, description: "a NodeId: 64 lowercase hex or node1… bech32 (63 chars), typed or scanned (§7.2 (2))" } }
    ContactCreate:
      description: "Exactly one of `card` or `node_id`."
      oneOf: [ { $ref: "#/components/schemas/ContactAddByCard" }, { $ref: "#/components/schemas/ContactAddByNodeId" } ]
    ContactPatch:
      type: object
      properties:
        alias: { type: [string, "null"], maxLength: 64 }
        accept: { type: boolean, const: true, description: "accept a pending message request; only `true` is valid" }
        pinned: { type: boolean }
        read_seq: { type: integer, minimum: 0, description: "mark the thread read up to this `local_seq`; the read mark only moves forward, a lower value changes nothing" }
    QrMatrix:
      type: object
      required: [size, rows]
      description: "A QR module matrix the UI draws itself (no image is served). Quiet zone not included."
      properties:
        size: { type: integer, minimum: 1, description: "modules per side" }
        rows: { type: array, items: { type: string, pattern: "^[01]+$" }, description: "`size` strings of `size` characters each, top row first; 1 is a dark module" }
    Card:
      type: object
      required: [text, qr]
      description: "A contact card: the public announce (L2 §6.2) as base32 text and as a QR matrix. Public material only."
      properties:
        text: { type: string }
        qr: { $ref: "#/components/schemas/QrMatrix" }
    LinkKind: { type: string, enum: [tcp-lan, kiss-modem, meshtastic-client, rns-bridge, ble] }
    LinkState: { type: string, enum: [down, up, degraded] }
    FabricPathProfile:
      type: object
      required: [mtu_bytes, framing, reliable, broadcast, cost_class, airtime]
      description: "What a link's path can carry (§8). The fabric never rate-limits; airtime is an advertised physical fact."
      properties:
        mtu_bytes: { type: integer, minimum: 1 }
        framing: { type: string, enum: [stream, datagram] }
        reliable: { type: boolean }
        broadcast: { type: boolean }
        cost_class: { type: string, enum: [bulk, low_bandwidth] }
        airtime:
          oneOf:
            - { type: object, required: [duty_cycle_permille, bits_per_s], properties: { duty_cycle_permille: { type: integer, minimum: 0 }, bits_per_s: { type: integer, minimum: 0 } } }
            - { type: "null" }
    FabricLink:
      type: object
      required: [id, kind, state, peers, detail, profile]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/LinkKind" }
        state: { $ref: "#/components/schemas/LinkState" }
        peers: { type: integer, minimum: 0, description: "attributed peers on this link (0 unless up)" }
        detail: { type: [string, "null"], description: "why the link is degraded, one plain sentence" }
        profile: { $ref: "#/components/schemas/FabricPathProfile" }
    FabricHub:
      type: object
      required: [enrolled, connected, reachable, cursor, node_id, address, members, offer_active]
      description: "Both ends of the hub relationship (§9): the member side (enrolled, connected, reachable, cursor) and the hub side (members, offer_active)."
      properties:
        enrolled: { type: boolean, description: "this node has a home hub" }
        connected: { type: boolean, description: "a connection to the home hub is up that this node may send on, but the hub has not answered on it yet; promises no delivery (false when not enrolled)" }
        reachable: { type: boolean, description: "an attributed link to the home hub is up: the hub answered on the current connection" }
        cursor: { type: integer, minimum: 0, description: "mailbox cursor committed with the home hub (the hub's own insertion sequence; no clock)" }
        node_id: { type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: "the home hub; null when not enrolled" }
        address: { type: [string, "null"], description: "host:port of the home hub's tcp-lan listener; null when not enrolled" }
        members: { type: integer, minimum: 0, description: "hub role: enrolled members of this node (0 when it is not a hub)" }
        offer_active: { type: boolean, description: "hub role: an enrollment code is outstanding" }
    FabricCustody:
      type: object
      required: [count, bytes]
      description: "Sealed items this node holds for its members (hub role). It cannot read them."
      properties: { count: { type: integer, minimum: 0 }, bytes: { type: integer, minimum: 0 } }
    FabricStore:
      type: object
      required: [open, used, watermark, store_full]
      description: "The encrypted local store (§10). Pruned by capacity only; `store_full` means new custody and bulk are refused."
      properties:
        open: { type: boolean }
        used: { type: integer, minimum: 0, description: "live bytes: DB pages minus freelist, plus the blob dir" }
        watermark: { type: integer, minimum: 0, description: "the high watermark in bytes that triggers pruning" }
        store_full: { type: boolean }
        restore_pending: { type: boolean, description: "the identity holder reports a restore floor (§4): nothing is sealed, new messages are refused 409 and no link runs until it is set. false when the store is not open; absent from older daemons" }
    FabricSettings:
      type: object
      required: [hub_role, listen_lan, custody_opt_in, quotas]
      properties:
        hub_role: { type: boolean, description: "accept custody for enrolled members" }
        listen_lan: { type: boolean, description: "bind the tcp-lan listener on the LAN (the hub role binds it too; with both off nothing listens — loopback is never a peer)" }
        custody_opt_in: { type: boolean, description: "an always-on laptop or a phone opts in to hold custody (Cat 4 hubs default on)" }
        quotas: { type: object, additionalProperties: { type: [integer, "null"], minimum: 0 }, description: "capacity shaping per refusable stored-data class, in bytes: kb, update, patch, sync, object, custody (messages and agent ops are never refused, §10.4, so they take no quota); null means no quota. Not a per-sender limit; those do not exist" }
    FabricSettingsPatch:
      type: object
      description: "Partial merge. In `quotas`, a class set to null drops its quota; only the refusable classes (kb, update, patch, sync, object, custody) take one — any other key is 400."
      properties:
        hub_role: { type: boolean }
        listen_lan: { type: boolean }
        custody_opt_in: { type: boolean }
        quotas: { type: object, additionalProperties: { type: [integer, "null"], minimum: 0 } }
    FabricCounters:
      type: object
      required: [dropped, stale, refused_requests, retransmits, inferred_lost, max_outstanding, regressed, piggybacked, items_pushed, items_received, conflicts, errors]
      description: "Diagnostics for Advanced views (§18 rule 1: a failure leaves no trace but a counter). Counted since the fabric started; reset at every start. Never a health verdict on their own."
      properties:
        dropped: { type: integer, minimum: 0, description: "frames that failed to open or verify" }
        stale: { type: integer, minimum: 0, description: "verified packets the replay window judged stale (never attributing a connection)" }
        refused_requests: { type: integer, minimum: 0, description: "first-contact INTROs refused by capacity (dropped without an ACK, §7.2)" }
        retransmits: { type: integer, minimum: 0, description: "fragment retransmissions (each re-sealed)" }
        inferred_lost: { type: integer, minimum: 0, description: "fragments presumed lost from ACK evidence (a later-sent fragment was acknowledged first, §5)" }
        max_outstanding: { type: integer, minimum: 0, description: "the most fragments ever outstanding to one peer (§5: at most 16)" }
        regressed: { type: integer, minimum: 0, description: "acknowledgement bits that went back after the receiver evicted a partial message" }
        piggybacked: { type: integer, minimum: 0, description: "ACK blocks that rode a data packet (§6.1)" }
        items_pushed: { type: integer, minimum: 0, description: "hub role: mailbox items streamed to members" }
        items_received: { type: integer, minimum: 0, description: "member: mailbox items received from the home hub" }
        conflicts: { type: integer, minimum: 0, description: "announces or cards whose keys conflict with a pinned contact (dropped, §7.1)" }
        errors: { type: integer, minimum: 0, description: "store or identity-holder failures inside the fabric" }
    FabricStatus:
      type: object
      required: [schema, links, hub, custody, store, settings]
      properties:
        schema: { type: integer }
        links: { type: array, items: { $ref: "#/components/schemas/FabricLink" } }
        hub: { $ref: "#/components/schemas/FabricHub" }
        custody: { $ref: "#/components/schemas/FabricCustody" }
        store: { $ref: "#/components/schemas/FabricStore" }
        settings: { $ref: "#/components/schemas/FabricSettings" }
        counters: { $ref: "#/components/schemas/FabricCounters", description: "diagnostics for Advanced; absent while the fabric is not running (store.open false) and from older daemons" }
    HubEnrollRequest:
      type: object
      required: [address, code]
      properties:
        address: { type: string, minLength: 1, description: "the hub's tcp-lan address, host:port" }
        code: { type: string, description: "the hub's 8-character one-time code; dashes, spaces and case ignored" }
        card: { type: string, description: "the hub's card text, needed to seal ENROLL when the hub is not already a contact (the offer bundle carries it)" }
    HubOffer:
      type: object
      required: [schema, code, address, card, bundle]
      properties:
        schema: { type: integer }
        code: { type: string, description: "8 characters, single use, attempt lockout after 5 failures; shown once" }
        address: { type: [string, "null"], description: "host:port of this hub's tcp-lan listener (the LAN IP); null while no LAN address is known" }
        card: { $ref: "#/components/schemas/Card", description: "this hub's own card" }
        bundle: { $ref: "#/components/schemas/Card", description: "what the member scans or pastes: the hub's card, address and code in one text and QR" }
    NearbyNode:
      type: object
      required: [id, num, long_name, short_name, last_heard_hint]
      description: "One node heard through a source (§14). Every string is an untrusted RF-origin value (names truncated to 40 bytes, control characters stripped): render as text only, and hand it to the agent only inside a labelled untrusted block. Never a contact: Meshtastic is a different identity system."
      properties:
        id: { type: string, description: "the source's own node id, e.g. !a1b2c3d4 for Meshtastic" }
        num: { type: integer, minimum: 0, description: "the node number" }
        long_name: { type: string }
        short_name: { type: string }
        pubkey: { type: [string, "null"], description: "as the board reports it; display only" }
        snr: { type: [number, "null"] }
        rssi: { type: [integer, "null"] }
        hops_away: { type: [integer, "null"], minimum: 0 }
        last_heard_hint: { type: [string, "null"], format: date-time, description: "from the node's own clock; a display hint, never an ordering or a freshness proof" }
        position: { type: [object, "null"], properties: { lat: { type: number }, lon: { type: number }, alt_m: { type: [number, "null"] } } }
        channel_utilization: { type: [number, "null"] }
    NearbySource:
      type: object
      required: [id, kind, label, device_id, nodes]
      description: "A presence source. v1: one per identified Meshtastic board, grouped as 'heard via Meshtastic on <board alias>'."
      properties:
        id: { type: string }
        kind: { type: string, enum: [meshtastic, reticulum], description: "Layer 6 adds `reticulum`: announces the LXMF helper hears. For a `reticulum` source a node's `id` is the 32-hex destination hash, `num` is 0, `long_name` is the announced display name (untrusted) and `short_name` its first 8 hex; `device_id` is null. Unknown kinds render as `unknown`" }
        label: { type: string, description: "plain heading, e.g. heard via Meshtastic on Bench radio" }
        device_id: { type: [string, "null"], description: "the DeviceRecord this source reads through" }
        nodes: { type: array, items: { $ref: "#/components/schemas/NearbyNode" } }
    PanelState:
      type: object
      required: [enabled, listening, health]
      properties:
        enabled: { type: boolean, description: "the panel is enabled; only enabled panels hold a listener" }
        listening: { type: boolean }
        health: { type: string, enum: [up, down, unknown], description: "the upstream's child state (never a connect); 2-tick debounce like every service" }
        dropped: { type: integer, minimum: 0, description: "shim panels: FromRadio frames dropped by the capacity-bounded drop-oldest buffer (§14)" }
    Panel:
      type: object
      required: [id, port, entry, needs_secure_context, allow, optional_hosts, state]
      description: "A hosted panel (§13): an adopted project's own web UI on its own origin `http://<host as typed>:<port>`. The UI builds the origin from `location.hostname` and `port`, never from a shared snapshot. The dashboard frames only registry-declared panels."
      properties:
        id: { $ref: "#/components/schemas/ServiceId", description: "= the service id and KB link" }
        port: { type: integer, minimum: 11190, maximum: 11229, description: "the listener slot, stable in state/panels.json" }
        entry: { type: string, description: "entry path, e.g. /" }
        needs_secure_context: { type: boolean, description: "true: the tab shows the open-on-the-node message instead of a frame when the dashboard origin is not potentially trustworthy" }
        allow: { type: array, items: { type: string }, description: "iframe `allow` features, origin-scoped (e.g. serial, bluetooth)" }
        optional_hosts: { type: array, items: { type: string }, description: "off-origin hosts an internet-connected browser will contact (verified at the offline lint); shown to the user" }
        state: { $ref: "#/components/schemas/PanelState" }
        title: { type: string, description: "frame chrome title" }
        secure_note: { type: [string, "null"], description: "plain-language note on Web Serial/Bluetooth limits for this panel" }
    PanelSession:
      type: object
      required: [schema, url, expires_in]
      properties:
        schema: { type: integer }
        url: { type: string, description: "one-time ticket URL on the panel origin (128-bit, single use)" }
        expires_in: { type: integer, minimum: 1, description: "seconds until the ticket expires (30)" }
    IdentifyRequest:
      type: object
      required: [consent]
      properties: { consent: { type: boolean, const: true, description: "the user agreed to this probe; only `true` is valid. Opening a serial port can reset the board (DTR/RTS)" } }
    SseMessage:
      type: object
      required: [change, peer, message]
      description: "A new message, a state change, or a new message request. Coalesced per message per tick (a 16-fragment transfer emits one frame per tick, carrying the latest state), so `change` is the first change since the previous frame: a message new to the client stays `new`."
      properties:
        change: { type: string, enum: [new, state, request] }
        peer: { $ref: "#/components/schemas/NodeId" }
        message: { $ref: "#/components/schemas/Message" }
    SseContact:
      type: object
      required: [change, contact]
      description: "`removed` carries the contact as it was; `request` is a new message request (also a `message` frame for its held message)."
      properties:
        change: { type: string, enum: [added, updated, removed, request] }
        contact: { $ref: "#/components/schemas/Contact" }
    SseNearby: { type: object, required: [sources], properties: { sources: { type: array, items: { $ref: "#/components/schemas/NearbySource" } } } }
    SsePanels: { type: object, required: [panels], properties: { panels: { type: array, items: { $ref: "#/components/schemas/Panel" } } } }
    # ---- Layer 6: Transport & Bridge (60-transport/README.md §3–§11; D27; additive) ----
    NetworkId: { type: string, pattern: "^[a-z0-9][a-z0-9:_-]{0,39}$", description: "a network id (§3): `111` (the fabric; appears only in orderings), `meshtastic`, `lxmf`, `app:deltachat`, `app:simplex`. Open vocabulary: an unknown id renders as `unknown`. The colon in `app:…` is percent-encoded in a path." }
    ForeignConversationId: { type: string, pattern: "^fc-[A-Za-z0-9_-]{1,125}$", description: "`fc-…`, minted by 111d. API bodies and proposals name a conversation by this id, never by native id or name." }
    ForeignMessageId: { type: string, pattern: "^fm-[A-Za-z0-9_-]{1,125}$", description: "`fm-…`, minted by 111d, one per stored row (a split send is one row per part). Never a 111 `msg-…` id." }
    BridgeEdgeId: { type: string, pattern: "^be-[A-Za-z0-9_-]{1,125}$" }
    SendGroupId: { type: string, pattern: "^sg-[A-Za-z0-9_-]{1,125}$" }
    ComponentId: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$", description: "an optional component's id from `assets/components/<id>.toml` (§2.1)" }
    Sha256Hex: { type: string, pattern: "^[0-9a-f]{64}$", description: "lowercase hex SHA-256 of the exact UTF-8 bytes of the consent text it names" }
    ForeignMessageState:
      type: string
      enum: [queued, sent, relayed, delivered, failed]
      description: "Delivery evidence for a foreign row (§4), CLOSED. Monotone: `delivered` never regresses; `failed` is only for a refusal BEFORE air (see `reason_code`) and is terminal unless a later `delivered` arrives. A NAK after the board transmitted keeps `sent` or `relayed` with `evidence` 'transmitted, not confirmed'. Layer 5's `MessageState` stays at four and is not used for foreign rows."
    ForeignAuth:
      type: string
      enum: [none, channel-key, pki, signed, attested-111]
      description: "How far the sender is vouched for (§3), closed; the copy for each level comes from the adapter manifest (`Network.copy.auth`). none: nothing. channel-key: anyone with this channel key can use any name. pki: the board's PKI proved the sender key, not the name. signed: the carrier reports a validated signature (LXMF only in v1). attested-111: reserved for the second release."
    ForeignConvKind: { type: string, enum: [channel, dm, group], description: "`group` is a destination-only local recipient list (LXMF has no channels) or an app-peer group" }
    ForeignReasonCode:
      type: string
      enum: [region_unset, no_channel, too_large, not_authorized, pki_failed, got_nak, adapter_down, no_route, timeout, max_retransmit, no_response, duty_cycle, rate_limited, key_unknown, peer_unannounced, uplink_off, ham_unconfirmed, consent_paused, cancelled, oversize]
      description: "The vocabulary of `ForeignMessage.reason_code` (§4, §5, §8), documented here once. Before air (state `failed`): region_unset, no_channel, too_large, not_authorized, pki_failed, got_nak, adapter_down. After air (state stays sent/relayed, 'transmitted, not confirmed'): no_route, timeout, max_retransmit, no_response. Retry later (state `queued`): duty_cycle, rate_limited, key_unknown, peer_unannounced, adapter_down. Consent gates: uplink_off, ham_unconfirmed, consent_paused. User acts: cancelled. oversize: refused for size in `refuse` mode. `reason_code` itself is a plain string on the wire so that growth is additive; clients render unknown values as `unknown`."
    NetworkState: { type: string, enum: [live, not_set, error, disabled], description: "live: adapter up. not_set: needs a human fact first (no board bound, region unset). error: adapter failed or partitioned (see `reason`). disabled: optional component not enabled; its cached and installed size is in `component`." }
    ComponentState: { type: string, enum: [declared, cached, installed, running, disabled], description: "§2.1. declared: in the release, no payload. cached: payload in cache/packages, nothing installed. installed: files installed, not running. running: supervised child up. disabled: was enabled, stopped by the user (installed files remain until remove-files)." }
    ComponentLicense:
      type: object
      required: [spdx, read_at, notice]
      properties:
        spdx: { type: string, description: "SPDX expression of the third-party program, e.g. MPL-2.0" }
        read_at: { type: string, description: "where to read the licence (URL or path in the cache)" }
        notice: { type: string, description: "the one-line notice shown before enable (program, licence, where to read it, cached size); its hash is `Component.notice_hash`" }
    Component:
      type: object
      required: [id, adapter, state, cached_bytes, installed_bytes, license, notice_hash, acknowledged]
      description: "An optional third-party component (§2.1). While `disabled` or only `declared`/`cached` it has no process, listener, loaded code, timer or open file; the sizes are what enabling would add."
      properties:
        id: { $ref: "#/components/schemas/ComponentId" }
        adapter: { $ref: "#/components/schemas/NetworkId", description: "the network this component carries" }
        state: { $ref: "#/components/schemas/ComponentState" }
        cached_bytes: { type: [integer, "null"], minimum: 0, description: "size of the cached payload; null when none is cached" }
        installed_bytes: { type: [integer, "null"], minimum: 0, description: "size of the installed tree; null when not installed" }
        rss_bytes: { type: [integer, "null"], minimum: 0, description: "declared resident size while running (from the manifest `[weight]`); null when unmeasured" }
        license: { $ref: "#/components/schemas/ComponentLicense" }
        notice_hash: { $ref: "#/components/schemas/Sha256Hex", description: "the hash `POST …/enable` must echo as `accept_notice_hash`" }
        acknowledged: { type: boolean, description: "the user's acknowledgement of this notice (this hash) is recorded in state/bridge.json" }
        reason_code: { type: [string, "null"], description: "stable snake_case, display-only; e.g. payload_missing, pin_mismatch, requires_unmet, child_degraded. null when nothing needs explaining" }
        reason: { type: [string, "null"], description: "one plain sentence for `reason_code`" }
    NetworkCopy:
      type: object
      required: [banner, send_warning, relay_tag, auth]
      description: "The adapter's honest copy, from `assets/adapters/<id>.toml`, so the UI holds no per-network code (§4)."
      properties:
        banner: { type: string, description: "what this network is and is not, shown on the thread" }
        send_warning: { type: string, description: "what sending means here (who can read it, what is published), shown before the first send" }
        relay_tag: { type: string, pattern: "^[A-Za-z]{1,3}$", description: "the TAG in the relay marker `[name/TAG]` (M, LX, DC, SX)" }
        auth: { type: object, additionalProperties: { type: string }, description: "`ForeignAuth` level to its label copy" }
        dm_note: { type: [string, "null"], description: "DM-specific note, e.g. 'Send a Meshtastic DM from this node (readable, not 111-sealed)'" }
    NetworkCaps:
      type: object
      required: [kinds, max_text_bytes, evidence, airtime, auth_levels, splittable, recipient_syntax]
      description: "What the adapter can carry (§4); read by preview, the UI and the agent."
      properties:
        kinds: { type: array, items: { $ref: "#/components/schemas/ForeignConvKind" } }
        max_text_bytes: { type: object, additionalProperties: { type: object, additionalProperties: { type: integer, minimum: 1 } }, description: "conversation kind to mode to bytes per packet; mode `default` is always present, other modes are adapter-defined (e.g. `licensed`)" }
        evidence: { type: array, items: { $ref: "#/components/schemas/ForeignMessageState" }, description: "the states this adapter can report (Meshtastic channels never reach `delivered`)" }
        airtime:
          oneOf:
            - { type: object, required: [duty_cycle_permille, bits_per_s, rule], properties: { duty_cycle_permille: { type: integer, minimum: 0 }, bits_per_s: { type: integer, minimum: 0 }, rule: { type: string, description: "the preview's estimate rule in words; always labelled an estimate" } } }
            - { type: "null" }
        auth_levels: { type: array, items: { $ref: "#/components/schemas/ForeignAuth" } }
        splittable: { type: boolean, description: "the adapter supports `size_mode: split` (numbered parts)" }
        recipient_syntax:
          oneOf:
            - { type: object, required: [label, pattern, example], properties: { label: { type: string }, pattern: { type: string, description: "ECMAScript-compatible regular expression for one native address" }, example: { type: string } } }
            - { type: "null" }
    NetworkGate:
      type: object
      required: [region_set, licensed, ham_confirmed, uplink_channels]
      description: "Facts for the foreign compose gate (§10). null means not applicable to this network."
      properties:
        region_set: { type: [boolean, "null"], description: "the radio region is set (a board transmits nothing before it)" }
        licensed: { type: [boolean, "null"], description: "an account of this node is an amateur-licensed board" }
        ham_confirmed: { type: [boolean, "null"], description: "a human confirmed readable sends through the licensed account" }
        uplink_channels: { type: integer, minimum: 0, description: "channels whose board publishes them to the internet (MQTT uplink)" }
    NetworkCounts:
      type: object
      required: [conversations, unread, queued, edges]
      properties:
        conversations: { type: integer, minimum: 0 }
        unread: { type: integer, minimum: 0, description: "foreign DM unread only counts here; it never raises the header badge (§10)" }
        queued: { type: integer, minimum: 0, description: "own rows still `queued` (waiting for the radio, a path or a key)" }
        edges: { type: integer, minimum: 0, description: "relay edges with an endpoint on this network" }
    Network:
      type: object
      required: [id, label, chip, state, account, copy, caps, gate, counts, dropped, component]
      description: "One bridgeable foreign network (§10). Every foreign string reachable from it (account, names) is untrusted: render as text only."
      properties:
        id: { $ref: "#/components/schemas/NetworkId" }
        label: { type: string, description: "from the adapter manifest, e.g. Meshtastic" }
        chip: { type: string, description: "the short network chip shown on every foreign message" }
        state: { $ref: "#/components/schemas/NetworkState" }
        reason_code: { type: [string, "null"], description: "stable snake_case, display-only: region_unset, no_board, adapter_down, partitioned, component_unavailable, … null while live" }
        reason: { type: [string, "null"], description: "one plain sentence for `reason_code`" }
        account: { type: [string, "null"], description: "which board or identity of ours speaks on this network (e.g. the board's long name and `!id`, or the LXMF destination hash); null when none" }
        copy: { $ref: "#/components/schemas/NetworkCopy" }
        caps: { $ref: "#/components/schemas/NetworkCaps" }
        gate: { $ref: "#/components/schemas/NetworkGate" }
        counts: { $ref: "#/components/schemas/NetworkCounts" }
        dropped: { type: integer, minimum: 0, description: "texts the adapter dropped while 111 was busy (bounded inbound queue overflow); shown as 'N texts dropped while 111 was busy', never silent (§4)" }
        component: { oneOf: [ { $ref: "#/components/schemas/Component" }, { type: "null" } ], description: "the optional component behind this network, or null for the compiled-in Meshtastic adapter" }
    ForeignConversation:
      type: object
      required: [id, network, account, kind, native_id, title, last_seq, unread, pinned, send_enabled]
      properties:
        id: { $ref: "#/components/schemas/ForeignConversationId" }
        network: { $ref: "#/components/schemas/NetworkId" }
        account: { type: string, description: "which board or identity of ours this conversation belongs to" }
        kind: { $ref: "#/components/schemas/ForeignConvKind" }
        native_id: { type: string, description: "the network's own id (`!a1b2c3d4`, a destination hash, a channel `ch:<name>:<kh>`); untrusted, text only" }
        title: { type: string, description: "foreign name; UNTRUSTED, control and format characters already stripped, text only" }
        last_seq: { type: integer, minimum: 0, description: "highest `seq` stored for this conversation (0 when empty)" }
        unread: { type: integer, minimum: 0 }
        pinned: { type: boolean, description: "pinned conversations are never pruned and may raise the attention count" }
        uplink: { type: [boolean, "null"], description: "channels: the board publishes this channel to the internet (MQTT uplink), read live; null when not applicable" }
        send_enabled: { type: [boolean, "null"], description: "the per-channel send switch (`PATCH /bridge/settings`); an uplinked channel is off by default; null when not applicable (a DM or a recipient list)" }
    ForeignSender:
      type: object
      required: [native, name]
      properties:
        native: { type: string, description: "the sender's id on that network (`!a1b2c3d4`, a destination hash); untrusted" }
        name: { type: string, description: "the sender's self-declared name; UNTRUSTED: `auth` says what, if anything, vouches for it" }
    ForeignPart:
      type: object
      required: [k, n]
      properties: { k: { type: integer, minimum: 1 }, n: { type: integer, minimum: 2 } }
    ForeignRelayedFrom:
      type: object
      required: [msg, edge]
      description: "Set on a relayed copy (an `own` row made by an edge)"
      properties: { msg: { $ref: "#/components/schemas/ForeignMessageId", description: "the origin row" }, edge: { $ref: "#/components/schemas/BridgeEdgeId" } }
    ForeignMessage:
      type: object
      required: [id, conv, dir, sender, auth, text, state, evidence, reason_code, reason, group_id, part, relayed_from, via_internet, seq, at, claim_ts, truncated]
      description: "One stored foreign row (§3). Order is `seq` (receipt sequence from the store-wide counter); `at` and `claim_ts` are display only and order nothing. Peer-authored fields (`text`, `sender.name`) are untrusted: text-only rendering, and the agent sees them only inside a labelled untrusted block."
      properties:
        id: { $ref: "#/components/schemas/ForeignMessageId" }
        conv: { $ref: "#/components/schemas/ForeignConversationId" }
        dir: { type: string, enum: [in, own] }
        sender: { $ref: "#/components/schemas/ForeignSender" }
        auth: { $ref: "#/components/schemas/ForeignAuth" }
        text: { type: string, description: "stored body after the one ingest function (Cc and Cf stripped, NFC, capped at 64 KiB). Foreign text: untrusted" }
        state: { $ref: "#/components/schemas/ForeignMessageState", description: "dir=in is always `delivered` (it arrived here)" }
        evidence: { type: [string, "null"], description: "the string the UI prints for the state, from the adapter (e.g. 'accepted by the radio', 'a neighbour rebroadcast it'); null for dir=in" }
        reason_code: { type: [string, "null"], description: "stable snake_case, display-only for clients; the vocabulary is `ForeignReasonCode` (region_unset, no_channel, too_large, not_authorized, pki_failed, got_nak, adapter_down, no_route, timeout, max_retransmit, no_response, duty_cycle, rate_limited, key_unknown, peer_unannounced, uplink_off, ham_unconfirmed, consent_paused, cancelled, oversize). Unknown values render as `unknown`. null when nothing needs explaining" }
        reason: { type: [string, "null"], description: "one plain sentence for `reason_code`" }
        group_id: { oneOf: [ { $ref: "#/components/schemas/SendGroupId" }, { type: "null" } ], description: "the send group a user-composed row belongs to" }
        part: { oneOf: [ { $ref: "#/components/schemas/ForeignPart" }, { type: "null" } ], description: "k of n for one part of a split send; the UI shows the lowest state among a send's parts" }
        relayed_from: { oneOf: [ { $ref: "#/components/schemas/ForeignRelayedFrom" }, { type: "null" } ] }
        via_internet: { type: boolean, description: "Meshtastic `via_mqtt`: the packet reached the board over an MQTT bridge. Shown as 'via internet'" }
        seq: { type: integer, minimum: 0, description: "local ordering sequence (the store's `local_seq`); strictly increasing per node" }
        at: { type: string, format: date-time, description: "local wall-clock time this node stored the row. Display only" }
        claim_ts: { type: [string, "null"], format: date-time, description: "the foreign side's own timestamp, unverified: shown only behind a 'sender's claim' disclosure. null when absent" }
        truncated: { type: [integer, "null"], minimum: 0, description: "when the stored body was cut at 64 KiB, the original size in bytes (the UI says 'message too long to show (N bytes)'); null otherwise" }
    ForeignThread:
      type: object
      required: [schema, conversation, messages, more]
      properties:
        schema: { type: integer }
        conversation: { $ref: "#/components/schemas/ForeignConversation" }
        messages: { type: array, items: { $ref: "#/components/schemas/ForeignMessage" } }
        more: { type: boolean }
    ForeignDmOpen:
      type: object
      required: [kind, native_id]
      properties:
        kind: { type: string, const: dm }
        native_id: { type: string, minLength: 1, maxLength: 128, description: "the recipient's native address on that network" }
    SendMode: { type: string, enum: [refuse, split], description: "per target: refuse (default) answers oversize and sends nothing; split cuts at UTF-8 boundaries into numbered parts `(k/n) `. Truncation never happens silently." }
    PlanWarning:
      type: object
      required: [code, text]
      description: "A fact that does not refuse the send: the row queues or goes out with it."
      properties:
        code: { type: string, description: "stable snake_case: region_unset, duty_cycle, adapter_down, uplink_channel, parts_out_of_order, … " }
        text: { type: string }
    SendPlan:
      type: object
      required: [bytes, cap, parts, size_mode, airtime_estimate, refusal, warnings]
      description: "What a send will do to one target (§9)."
      properties:
        bytes: { type: integer, minimum: 0, description: "UTF-8 bytes of the text, plus the relay or part overhead that would be added" }
        cap: { type: [integer, "null"], minimum: 1, description: "the target's `max_text_bytes` for its kind and mode; null when the carrier states none" }
        parts: { type: integer, minimum: 1, description: "1 unless `size_mode` is split and the text is over the cap" }
        size_mode: { $ref: "#/components/schemas/SendMode" }
        airtime_estimate:
          oneOf:
            - { type: object, required: [millis, label], properties: { millis: { type: [integer, "null"], minimum: 0 }, label: { type: string, description: "always labelled an estimate, e.g. 'about 2.1 s (estimate)' or 'depends on the path'" } } }
            - { type: "null" }
        refusal: { oneOf: [ { $ref: "#/components/schemas/PlanRefusal" }, { type: "null" } ], description: "non-null: this target would be refused and (in a fan-out) nothing is queued" }
        warnings: { type: array, items: { $ref: "#/components/schemas/PlanWarning" } }
    PlanRefusal:
      type: object
      required: [code, detail, consent]
      properties:
        code: { type: string, enum: [oversize, ham_unconfirmed, uplink_off] }
        detail: { type: string, description: "plain sentence, e.g. '312 B > 232 B per packet'" }
        consent: { oneOf: [ { $ref: "#/components/schemas/ConsentRequired" }, { type: "null" } ], description: "for a consent gate (ham_unconfirmed, uplink_off): the exact text and hash to confirm via PATCH /bridge/settings; null for oversize" }
    ConsentRequired:
      type: object
      required: [action, subject, warning_text, hash, addons]
      description: "The 409 consent round-trip (§2.1, §8): the daemon states the exact text, the client shows it and echoes `hash` back (`accept_warning` or `accept_notice_hash`). A text that changed since (a live fact moved) has a new hash, so a stale echo is refused again. Never a bare PATCH."
      properties:
        action: { type: string, enum: [edge_enable, edge_resume, component_enable, ham_confirm, uplink_send], description: "which confirmation this is" }
        subject: { type: string, description: "what it is about: the edge id or `src>dst` pair, the component id, the account, or the channel's `fc-…` id" }
        warning_text: { type: string, description: "the exact text the user is confirming; may quote untrusted channel names: text only" }
        hash: { $ref: "#/components/schemas/Sha256Hex" }
        addons: { type: array, items: { type: string }, description: "the live add-on facts included in the text (default-key source, uplinked destination, licensed account) so the UI can badge them" }
    FanoutTarget:
      description: "One target of a fan-out: a foreign conversation (or recipient list) of an enabled network, or a 111 contact."
      oneOf:
        - { $ref: "#/components/schemas/FanoutForeignTarget" }
        - { $ref: "#/components/schemas/FanoutContactTarget" }
    FanoutForeignTarget:
      type: object
      required: [network, conv]
      properties:
        network: { $ref: "#/components/schemas/NetworkId" }
        conv: { $ref: "#/components/schemas/ForeignConversationId" }
        size_mode: { $ref: "#/components/schemas/SendMode", description: "this target's mode; falls back to the request's `size_mode`, then `refuse`" }
    FanoutContactTarget:
      type: object
      required: [node_id]
      properties: { node_id: { $ref: "#/components/schemas/NodeId", description: "an accepted 111 contact: an ordinary sealed message with Layer 5 states" } }
    FanoutRequest:
      type: object
      required: [text, targets]
      properties:
        text: { type: string, minLength: 1, description: "the text, copied into every target (nothing is exported from a 111 thread)" }
        targets: { type: array, minItems: 1, maxItems: 64, items: { $ref: "#/components/schemas/FanoutTarget" } }
        size_mode: { $ref: "#/components/schemas/SendMode", description: "default for targets that do not name one" }
    FanoutPreviewItem:
      type: object
      required: [target, plan]
      properties: { target: { $ref: "#/components/schemas/FanoutTarget" }, plan: { $ref: "#/components/schemas/SendPlan" } }
    FanoutPreview:
      type: object
      required: [schema, text_bytes, ok, items]
      properties:
        schema: { type: integer }
        text_bytes: { type: integer, minimum: 0 }
        ok: { type: boolean, description: "no target carries a `refusal`: sending now would queue every row" }
        items: { type: array, items: { $ref: "#/components/schemas/FanoutPreviewItem" } }
    SendItem:
      type: object
      required: [target, id, plan]
      properties:
        target: { $ref: "#/components/schemas/FanoutTarget" }
        id: { type: string, description: "the row: `fm-…` for a foreign target (the first part of a split), `msg-…` for a 111 contact" }
        ids: { type: array, items: { type: string }, description: "every row of a split send, one per part, in part order; absent for a single row" }
        plan: { $ref: "#/components/schemas/SendPlan" }
    SendGroup:
      type: object
      required: [id, text, items]
      description: "A fan-out as stored (§3, §9): per-target rows keep their own state, retry and cancel."
      properties:
        id: { $ref: "#/components/schemas/SendGroupId" }
        text: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/SendItem" } }
    FanoutResult:
      type: object
      required: [schema, group_id, items]
      properties:
        schema: { type: integer }
        group_id: { $ref: "#/components/schemas/SendGroupId" }
        items: { type: array, items: { $ref: "#/components/schemas/SendItem" } }
    ForeignSendRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        size_mode: { $ref: "#/components/schemas/SendMode" }
    ForeignSendAccepted:
      type: object
      required: [schema, id, plan]
      properties:
        schema: { type: integer }
        id: { $ref: "#/components/schemas/ForeignMessageId", description: "the row (the first part of a split send)" }
        ids: { type: array, items: { $ref: "#/components/schemas/ForeignMessageId" }, description: "every row of a split send, in part order; absent for a single row" }
        plan: { $ref: "#/components/schemas/SendPlan" }
    BridgeEdgeCounters:
      type: object
      required: [relayed, shed, refused]
      properties:
        relayed: { type: integer, minimum: 0, description: "copies handed to the destination adapter" }
        shed: { type: integer, minimum: 0, description: "backlog copies dropped oldest-first at capacity (shown as a visible counter; `relayed_seq` advances past them)" }
        refused: { type: integer, minimum: 0, description: "copies not made: too long in `refuse` mode ('N too long to relay'), or no ok-to-MQTT bit while `honour_ok_to_mqtt`" }
    BridgeEdge:
      type: object
      required: [id, src, dst, src_kind, dst_kind, enabled, enabled_by, paused, cursor_seq, relayed_seq, honour_ok_to_mqtt, oversize, consent_hash, counters, pause_reason]
      description: "An explicit, directed, non-transitive relay from `src` to `dst` (§8). Only a human enables one."
      properties:
        id: { $ref: "#/components/schemas/BridgeEdgeId" }
        src: { $ref: "#/components/schemas/ForeignConversationId" }
        dst: { $ref: "#/components/schemas/ForeignConversationId" }
        src_kind: { type: string, enum: [channel, group], description: "the source conversation's kind (denormalised, §3: a DM endpoint is unrepresentable)" }
        dst_kind: { type: string, enum: [channel, group] }
        enabled: { type: boolean, description: "read-only: false while either endpoint's adapter is not enabled (the edge is kept, nothing relays)" }
        enabled_by: { type: string, maxLength: 256, description: "which session enabled it (§3 `relay_edges.enabled_by`): `loopback`, or the paired session's label; never a secret" }
        paused: { type: boolean }
        cursor_seq: { type: integer, minimum: 0, description: "`seq` at enable: history is never relayed" }
        relayed_seq: { type: integer, minimum: 0, description: "highest origin `seq` handed to a copy; advanced on a shed too" }
        honour_ok_to_mqtt: { type: boolean, description: "off by default; when on, a Meshtastic-origin message without the ok-to-MQTT bit is not relayed off the mesh and counts as refused" }
        oversize: { type: string, enum: [refuse, split], description: "a copy is never truncated: refuse (default) or split into numbered parts" }
        consent_hash: { oneOf: [ { $ref: "#/components/schemas/Sha256Hex" }, { type: "null" } ], description: "hash of the warning text the human confirmed; null before the first confirmation" }
        counters: { $ref: "#/components/schemas/BridgeEdgeCounters" }
        pause_reason: { type: [string, "null"], description: "why it is paused: `user`, or `consent_paused` (a live consent fact changed after enable: uplink, licensed mode, channel key). null while not paused. Resuming a consent_paused edge needs the new text's hash" }
    BridgeEdgeCreate:
      type: object
      required: [src, dst]
      properties:
        src: { $ref: "#/components/schemas/ForeignConversationId" }
        dst: { $ref: "#/components/schemas/ForeignConversationId" }
        honour_ok_to_mqtt: { type: boolean, default: false }
        oversize: { type: string, enum: [refuse, split], default: refuse }
        accept_warning: { $ref: "#/components/schemas/Sha256Hex", description: "the `ConsentRequired.hash` of the warning the user was shown; absent on the first call (409 consent_required answers with the text)" }
    BridgeEdgePatch:
      type: object
      properties:
        paused: { type: boolean }
        honour_ok_to_mqtt: { type: boolean }
        oversize: { type: string, enum: [refuse, split] }
        accept_warning: { $ref: "#/components/schemas/Sha256Hex", description: "required to resume a consent_paused edge: the hash of the NEW warning text" }
    RecipientList:
      type: object
      required: [id, network, name, members]
      description: "A local, destination-only recipient list (§6): one DM per member from the bridge identity. A fan-out target and an edge destination, never a source."
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
        network: { $ref: "#/components/schemas/NetworkId" }
        name: { type: string, maxLength: 64, description: "user-chosen label; text only" }
        members: { type: array, maxItems: 256, items: { type: string }, description: "native addresses (e.g. 32-hex LXMF destinations), validated against `caps.recipient_syntax`" }
    ChannelSwitch:
      type: object
      required: [conv, network, send, uplink]
      properties:
        conv: { $ref: "#/components/schemas/ForeignConversationId" }
        network: { $ref: "#/components/schemas/NetworkId" }
        send: { type: boolean, description: "the per-channel send switch; gates every send on the channel, relay copies included" }
        uplink: { type: [boolean, "null"], description: "the board publishes this channel to the internet, read live" }
    HamAccount:
      type: object
      required: [account, licensed, confirmed]
      properties:
        account: { type: string, description: "which board of ours" }
        licensed: { type: boolean, description: "the board reports an amateur-licensed user, read live" }
        confirmed: { type: boolean, description: "a human confirmed readable sends and relays through this account (recorded with the text hash)" }
    BridgeAnnounce:
      type: object
      required: [name, interval_min]
      properties:
        name: { type: [string, "null"], maxLength: 64, description: "the LXMF display name announced; null = the default `111-<4 hex>`" }
        interval_min: { type: integer, minimum: 0, description: "minutes between announces; 0 = on events only" }
    BridgeSettings:
      type: object
      required: [schema, order, adapters, recipient_lists, channels, ham, announce]
      description: "Mirror of state/bridge.json plus the preferred order from interfaces.toml (§2, §11). No key material and no passphrase."
      properties:
        schema: { type: integer }
        order: { type: array, items: { $ref: "#/components/schemas/NetworkId" }, description: "the user's preferred networks, first = most preferred (drives the rail, Settings and the agent's setup proposals; runtime fall-back through the list is Layer 7)" }
        adapters: { type: object, additionalProperties: { type: boolean }, description: "network id to enabled, for compiled-in adapters; optional components are `Component.state`" }
        recipient_lists: { type: array, items: { $ref: "#/components/schemas/RecipientList" } }
        channels: { type: array, items: { $ref: "#/components/schemas/ChannelSwitch" } }
        ham: { type: array, items: { $ref: "#/components/schemas/HamAccount" } }
        announce: { $ref: "#/components/schemas/BridgeAnnounce" }
    BridgeChannelPatch:
      type: object
      required: [conv, send]
      properties:
        conv: { $ref: "#/components/schemas/ForeignConversationId" }
        send: { type: boolean }
        accept_warning: { $ref: "#/components/schemas/Sha256Hex", description: "turning send on for an uplinked channel needs the hash of its warning ('this channel is published to the internet by your board')" }
    BridgeHamPatch:
      type: object
      required: [account, confirmed]
      properties:
        account: { type: string }
        confirmed: { type: boolean }
        accept_warning: { $ref: "#/components/schemas/Sha256Hex", description: "confirming needs the hash of the licensee warning; withdrawing a confirmation needs none" }
    BridgeAnnouncePatch:
      type: object
      properties:
        name: { type: [string, "null"], maxLength: 64 }
        interval_min: { type: integer, minimum: 0 }
    BridgeSettingsPatch:
      type: object
      description: "Partial merge. `recipient_lists` replaces the whole set. `channels` and `ham` list only the entries that change; if several lack a current hash the 409 describes the first."
      properties:
        order: { type: array, items: { $ref: "#/components/schemas/NetworkId" } }
        adapters: { type: object, additionalProperties: { type: boolean } }
        recipient_lists: { type: array, items: { $ref: "#/components/schemas/RecipientList" } }
        channels: { type: array, items: { $ref: "#/components/schemas/BridgeChannelPatch" } }
        ham: { type: array, items: { $ref: "#/components/schemas/BridgeHamPatch" } }
        announce: { $ref: "#/components/schemas/BridgeAnnouncePatch" }
    ComponentEnableRequest:
      type: object
      properties:
        accept_notice_hash: { $ref: "#/components/schemas/Sha256Hex", description: "`Component.notice_hash` as shown to the user; absent on the first call (409 consent_required answers with the notice)" }
    ComponentRemoveRequest:
      type: object
      properties:
        cache: { type: boolean, default: false, description: "also delete the cached payload (separately confirmed; without it a later enable is offline)" }
    TransportInterface:
      type: object
      required: [name, type, up, rx, tx, peers]
      description: "One rnsd interface from the cached `rnstatus` (§11). Names and types are rnsd's strings: untrusted text."
      properties:
        name: { type: string }
        type: { type: string, description: "e.g. AutoInterface, RNodeInterface, BackboneInterface, TCPClientInterface" }
        up: { type: boolean }
        rx: { type: integer, minimum: 0, description: "bytes received since the interface came up" }
        tx: { type: integer, minimum: 0, description: "bytes sent since the interface came up" }
        peers: { type: [integer, "null"], minimum: 0, description: "heard peers or connected clients; null when the interface type does not report them" }
    TransportLan:
      type: object
      required: [backbone_listen, port, ifac]
      properties:
        backbone_listen: { type: boolean, description: "a BackboneInterface listener, rendered only while LAN sharing is on" }
        port: { type: integer, minimum: 1, maximum: 65535, description: "default 4242" }
        ifac: { type: boolean, description: "an IFAC passphrase is set (the passphrase itself is only on POST /transport/join)" }
    TransportPosture:
      type: object
      required: [share_instance, instance_name, enable_transport, lan, stock_autointerface, propagation_node]
      description: "The rnsd posture from interfaces.toml `[posture]` (§11)."
      properties:
        share_instance: { type: boolean }
        instance_name: { type: string }
        enable_transport: { type: boolean, description: "default true on Cat 3/4, false elsewhere" }
        lan: { $ref: "#/components/schemas/TransportLan" }
        stock_autointerface: { type: boolean, description: "second AutoInterface in the stock `reticulum` group: opt-in" }
        propagation_node: { type: boolean, description: "LXMF propagation role: opt-in" }
    TransportStatus:
      type: object
      required: [schema, interfaces, interfaces_state, posture, region, callsign, order]
      properties:
        schema: { type: integer }
        interfaces: { type: array, items: { $ref: "#/components/schemas/TransportInterface" } }
        interfaces_state: { type: string, enum: [ok, stale, unavailable], description: "the rnstatus cache: ok (fresh), stale (last good, tick missed), unavailable (rnsd absent or rnstatus failed; `interfaces` is empty)" }
        posture: { $ref: "#/components/schemas/TransportPosture" }
        region: { type: [string, "null"], description: "radio region id from the KB region table; null until a human sets it (a board transmits nothing before)" }
        callsign: { type: [string, "null"], maxLength: 16, description: "optional, for licensed operators; display and confirmation copy only" }
        order: { type: array, items: { $ref: "#/components/schemas/NetworkId" }, description: "the preferred networks, in the user's order" }
    TransportPosturePatch:
      type: object
      description: "Partial merge. Each part goes through apply, probe, revert (§12)."
      properties:
        posture:
          type: object
          properties:
            share_instance: { type: boolean }
            instance_name: { type: string, minLength: 1, maxLength: 32 }
            enable_transport: { type: boolean }
            lan:
              type: object
              properties: { backbone_listen: { type: boolean }, port: { type: integer, minimum: 1024, maximum: 65535 }, ifac: { type: boolean } }
            stock_autointerface: { type: boolean }
            propagation_node: { type: boolean }
        region: { type: string, minLength: 1, maxLength: 32, description: "a user-confirmed region id (the request is the confirmation); unknown id is 400" }
        callsign: { type: [string, "null"], maxLength: 16 }
        order: { type: array, items: { $ref: "#/components/schemas/NetworkId" } }
    TransportPostureResult:
      type: object
      required: [schema, applied, reverted, reason, status]
      properties:
        schema: { type: integer }
        applied: { type: boolean, description: "the change is live and probed good" }
        reverted: { type: boolean, description: "the probe failed within 30 s and the snapshot was restored; the previous posture is live" }
        reason: { type: [string, "null"], description: "one plain sentence when reverted" }
        status: { $ref: "#/components/schemas/TransportStatus" }
    TransportJoin:
      type: object
      required: [schema, address, port]
      description: "The phone-relay join descriptor (§11). Carries a shared network credential: served by POST only, no-store, never logged. Not identity key material."
      properties:
        schema: { type: integer }
        address: { type: string, description: "the hub's LAN address" }
        port: { type: integer, minimum: 1, maximum: 65535 }
        ifac_name: { type: string, description: "IFAC network name; absent when IFAC is off" }
        ifac_passphrase: { type: string, description: "IFAC passphrase; absent when IFAC is off. Never in a QR" }
    SseNetworkMessage:
      type: object
      required: [network, conv, change, seq]
      description: "A foreign message, state change or conversation change. Coalesced per message per tick for DMs and own rows, and per CONVERSATION per tick (conversation plus highest `seq`, no `id`) for unpinned channel traffic, so a flood cannot fill the 256-entry ring. `change` is the first change since the previous frame. Refetch the conversation; the frame carries no text."
      properties:
        network: { $ref: "#/components/schemas/NetworkId" }
        conv: { $ref: "#/components/schemas/ForeignConversationId" }
        id: { $ref: "#/components/schemas/ForeignMessageId", description: "absent on a coalesced channel frame and on `conversation`" }
        change: { type: string, enum: [new, state, conversation] }
        seq: { type: integer, minimum: 0, description: "highest `seq` in the conversation after the change" }
    SseBridge:
      type: object
      description: "Adapter and edge status as full snapshots (like `fabric`): a key is present only when that part changed."
      properties:
        networks: { type: array, items: { $ref: "#/components/schemas/Network" } }
        edges: { type: array, items: { $ref: "#/components/schemas/BridgeEdge" } }
    TargetRefusal:
      type: object
      required: [target, code, detail, consent]
      description: "One refused target in a 409 fan-out report (`Problem.targets`): nothing was queued for any target."
      properties:
        target: { $ref: "#/components/schemas/FanoutTarget" }
        code: { type: string, enum: [oversize, consent_required], description: "oversize: over the cap in refuse mode. consent_required: a gate (`ham_unconfirmed` or `uplink_off`, named in `consent.action`) needs a confirmation first" }
        detail: { type: string }
        consent: { oneOf: [ { $ref: "#/components/schemas/ConsentRequired" }, { type: "null" } ] }
x-sse-events:
  events:
    status: "#/components/schemas/Status"
    services: "#/components/schemas/SseServices"
    devices: "#/components/schemas/SseDevices"
    proposal: "#/components/schemas/SseProposal"
    agent: "#/components/schemas/SseAgentEvent"
    reset: "#/components/schemas/SseReset"
    message: "#/components/schemas/SseMessage"
    contact: "#/components/schemas/SseContact"
    fabric: "#/components/schemas/FabricStatus"
    nearby: "#/components/schemas/SseNearby"
    panels: "#/components/schemas/SsePanels"
    network_message: "#/components/schemas/SseNetworkMessage"
    bridge: "#/components/schemas/SseBridge"
  chat:
    token: "#/components/schemas/SseChatToken"
    tool: "#/components/schemas/SseChatTool"
    done: "#/components/schemas/SseChatDone"
    error: "#/components/schemas/SseChatError"
