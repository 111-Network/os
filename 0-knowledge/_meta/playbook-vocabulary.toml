# node111's compiled (layer, subject, reason) vocabulary (9-evolution/README.md §3.4, §6.3):
# one [[row]] per fingerprint a playbook's [match] may name, sorted by layer, subject and
# reason in byte order. Subject "any" is every component. service_row names the service row
# whose state `error` publishes the reason; it is absent for an exit fact (child_exit), a
# start fact (111d, updater), Layer 8's storage state (storage) and Layer 9's own (heal).
# Generated from 1-bootstrap/crates/node111/src/daemon/heal/vocab.rs by
# `cargo test -p node111 --test heal_playbooks vocabulary`; do not edit it by hand:
# UPDATE_PLAYBOOK_VOCABULARY=1 rewrites it, and the test, in CI too, fails while it differs.
# The playbook lint (0-knowledge/_meta/build.py) reads it.
