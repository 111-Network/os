[package]
name = "id111"
version = "0.0.0" # calver stamped at release time, mirroring node111
edition.workspace = true
license = "GPL-3.0-or-later" # project license: os/LICENSE.md; third-party boundaries: os/LICENSING.md

# Dependency policy (os/20-identity/TASKS.md): this set is frozen; additions need
# reviewer sign-off recorded in the task row.
#
# The set is spec §3 (os/20-identity/README.md) only, exact-pinned per §3 ("exact
# pins at build"). Normative floors: ed25519-dalek MUST be >=2.0
# (RUSTSEC-2022-0093; spec table names v2) and curve25519-dalek MUST be >=4.1.3
# (RUSTSEC-2024-0344). Pin rationale recorded in task row T1.
[dependencies]
# §3 — Ed25519 (RFC 8032) with the strict verify predicate; `verify_strict` is
# the only permitted wire-artifact verification path (dalek `verify()` banned).
# 2.2.0 = newest v2 (spec table); 3.0.0 exists but postdates the v2-named pin.
ed25519-dalek = "=2.2.0"
# §3 — RUSTSEC floor exactly (4.2.0 was yanked; 5.x is excluded by
# ed25519-dalek 2.x's ^4 requirement).
curve25519-dalek = "=4.1.3"
# §3/§6.4 — X25519 (RFC 7748). static_secrets = long-term node ECDH key type;
# getrandom = ephemeral constructors. The contributory/all-zero abort check
# (`SharedSecret::was_contributory`, RFC 7748 §6.1) is ungated — verified 2.0.1.
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "getrandom"] }
# §6.4 — XChaCha20-Poly1305. getrandom feature OFF: the nonce is derived,
# never random ("111/seal-n/v1" KDF, §6.4 step 3).
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
# §6.4 — BLAKE2b-256 key KDF + BLAKE2b-192 nonce derivation.
blake2 = "=0.11.0"
# §2 — HMAC-SHA512 for SLIP-0010; §7 — SHA-256 for the operator label.
sha2 = "=0.11.1"
hmac = "=0.13.0"
# §8.1 — PBKDF2-HMAC-SHA512 (BIP-39 seed derivation; bip39 carries its own
# implementation — this composes the frozen §3 set and the fallback path).
pbkdf2 = "=0.13.0"
# §8.1 — rust-bitcoin bip39: 2048-word English list, checksum-validating parse,
# NFKC-normalized restore (`parse_in_normalized`/`to_seed_normalized`). No
# "rand" feature: keygen draws entropy via §4 getrandom + `from_entropy`.
# `zeroize` feature (reviewer-approved at T11): makes `Mnemonic` ZeroizeOnDrop
# so the word-index array is wiped, not just released; pulls no new crate
# (zeroize 1.9.1 is already pinned below).
bip39 = { version = "=3.0.0", features = ["zeroize"] }
# §7 — BIP-173 bech32 ONLY (`Bech32` variant; bech32m is spec-banned), HRP "node".
bech32 = "=0.12.0"
# Secret hygiene for keyset/mnemonic material.
zeroize = { version = "=1.9.1", features = ["derive"] }
# §4 — the named entropy source on Cat 2+ (getrandom()). 0.2 line matches
# rand_core 0.6 (x25519-dalek) and the os/10-bootstrap lock; a 0.3/0.4 bump is a
# reviewer-sign-off change, not a scaffold choice.
getrandom = "=0.2.17"

[lib]
name = "id111"
path = "src/lib.rs"
