# Optional component declaration (Layer 6 §2.1; the format is node111's `daemon/components/manifest.rs`). Parsed with
# deny_unknown_fields like assets/panels/<id>.toml: an unknown key or an invalid file ⇒ not registered. The release
# carries no third-party bytes: `111 install` prints the notice below, records it in the install receipt, then
# downloads the hash-locked closure into cache/packages/lxmf/; nothing is installed or started until a human enables
# the component and acknowledges the notice (409 consent_required otherwise), and then only from that cache.
id = "lxmf"
adapter = "lxmf"                        # the network id this component carries (§3)
title = "Reticulum / LXMF helper"
kb_entry = "projects/lxmf"

[payload]
kind = "pip"                            # pip | binary
# The hash-locked closure (rns + lxmf + their dependencies; hashes only) rides beside this file as
# assets/components/lxmf.lock.txt, embedded in the signed binary. It is generated by the helper's gen_lock.py (C3)
# and pins rns to the release's rns-lock.txt version (§6). Until it lands the component is declared without a
# payload: install caches nothing and enable answers component_unavailable.
lock = "lxmf.lock.txt"
venv = "lxmf"                           # venvs/lxmf, a link to venvs/lxmf.d/<build> (the L1 presence pattern)

[requires]
python = "3.10"                         # the hash-locked closure resolves cffi/pycparser for >= 3.10 (rns and lxmf alone need 3.7, §6)
service = "transport"                   # rnsd must serve the shared instance before the helper starts (§6 "Start order")

[run]
# venvs/lxmf/bin/python -I <current>/share/lxmf-sidecar/lxmf_sidecar.py <args>, piped stdio (JSON Lines, §6), HOME=<root>.
# The adapter appends `--name <display name>`.
program = "share/lxmf-sidecar/lxmf_sidecar.py"
args = ["--config-dir", "{bridge}/rns", "--identity", "{bridge}/identity", "--storage", "{bridge}/store"]
ports = []                              # the helper listens on no port (§15.7)
health = "ready"                        # the first stdout line is {"type":"ready", ...} within the timeout
health_timeout_secs = 30

[weight]
cached_bytes = 0                        # recorded at pin time (C3); 0 = not measured
installed_bytes = 0
rss_bytes = 0

[license]
spdx = "LicenseRef-Reticulum"           # rns and lxmf: the Reticulum License (non-OSI; LICENSING.md §8)
read_at = "https://github.com/markqvist/Reticulum/blob/master/LICENSE"
notice = "Reticulum (rns) and LXMF are the work of the Reticulum project (reticulum.network) and are licensed under the Reticulum License; read it at https://github.com/markqvist/Reticulum/blob/master/LICENSE before you enable this. They are downloaded from PyPI, unmodified. You install them: 111 is not affiliated with the Reticulum project and is not their distributor."
