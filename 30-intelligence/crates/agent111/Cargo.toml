[package]
name = "agent111"
version = "0.1.0"
edition = "2021"
description = "111-agent: thin local-intelligence loop for the 111network mesh OS (Layer 3)"
license-file = "../../../LICENSE.md" # DRAFT project license (os/LICENSE.md); see os/LICENSING.md

[[bin]]
name = "111-agent"
path = "src/main.rs"

[lib]
name = "agent111"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
