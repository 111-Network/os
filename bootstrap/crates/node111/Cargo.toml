[package]
name = "node111"
version = "0.0.0" # calver stamped at release time; see scripts/release.sh
edition.workspace = true
license-file = "../../../LICENSE.md" # DRAFT project license (os/LICENSE.md); see os/LICENSING.md

[[bin]]
name = "111"
path = "src/main.rs"

# Dependency policy (os/bootstrap/TASKS.md): this set is frozen; additions need
# reviewer sign-off recorded in the task row.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net", "sync", "fs"] }
axum = "0.8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
# T10 (L1 v2.2, D14d): Layer 2's identity core replaces the provisional secp256k1
# seam. Path dep (dep-policy sign-off recorded in os/identity/TASKS.md row T10).
# k256 / bip39 2.x / bech32 0.11 / scrypt / chacha20poly1305 0.10 are dropped:
# every call site was in the deleted identity/{bip32,nip49}.rs (mnemonic
# ownership moved to id111's bip39 3.0.0 — converge, don't dual-pin).
id111 = { path = "../../../identity/crates/id111" }
minisign-verify = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1"
sysinfo = "0.33"
os_info = "3"
nusb = "0.1"
rtnetlink = "0.14"
sd-notify = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
libc = "0.2"
anyhow = "1"
tempfile = "3"
# T10 review: hmac 0.12 + unicode-normalization removed (zero call sites after
# the id111 seam swap). zeroize added (already in the graph via id111) to wipe
# recovery words typed into `111 identity restore` — reviewer sign-off.
zeroize = "1"
# T10/T5: payload tarball extraction. Pure-Rust backends only (musl determinism):
# flate2 with miniz_oxide (no zlib C), tar for the archive format.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Layer 4 R1 (D15, sign-off in os/bootstrap/TASKS.md dependency policy):
# mDNS `111.local` announce while LAN-bound (optional: `mdns` feature, default on,
# so a target that fails to link can build without it).
mdns-sd = { version = "0.21", default-features = false, optional = true }
# `111 dashboard` terminal QR of the pair URL (unicode renderer only; no image).
qrcode = { version = "0.14", default-features = false }
# Already in the graph (id111 / axum): session tokens + pair codes; SSE stream glue.
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Layer 4 R3: the `111d` → `111-agent` relay (loopback HTTP/1.1 client,
# src/util/http_async.rs). hyper / hyper-util / http-body-util are already in
# the graph via axum; this enables hyper's `client` + `http1` features (one
# connection per request, no pool). hyper's `client` feature pulls `want` +
# `try-lock` (tiny, hyper-ecosystem) — sign-off in os/bootstrap/TASKS.md.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

[features]
default = ["mdns"]
# mDNS `111.local` announce (Layer 4, D15). Disable for a target where mdns-sd
# fails to build/link: `--no-default-features` — the dashboard then lists only
# IP URLs.
mdns = ["dep:mdns-sd"]

[lib]
name = "node111"
path = "src/lib.rs"
