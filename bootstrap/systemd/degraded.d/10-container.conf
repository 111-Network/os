# Degraded relay drop-in (systemd-ful WSL/containers with --allow-degraded).
# Ambient capabilities are stripped: a container's CapBnd rarely includes
# NET_ADMIN/NET_RAW, and an ambient capability outside the bounding set fails
# the unit outright. The daemon degrades transport features accordingly.

[Service]
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
